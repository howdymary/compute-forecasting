[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-forecast"
version = "0.1.0"
description = "Reproducible research on advertised GPU rental rates."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
forecasting = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2"]
remote = ["modal", "httpx>=0.27,<1", "tinker", "tinker-cookbook"]

[project.scripts]
compute-forecast = "compute_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
