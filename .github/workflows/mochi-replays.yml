name: Mochi recorded cinematic trajectories
on:
  push:
    branches: [mochi-hackathon]
    paths: ['mochi/scripts/replay_batch.py', '.github/workflows/mochi-replays.yml']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./mochi modal==1.6.4
      - name: Record paired development highlight on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python mochi/scripts/replay_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-cinematic-replays-${{ github.run_id }}
          path: mochi/artifacts/cinematic-replays/
          retention-days: 30
