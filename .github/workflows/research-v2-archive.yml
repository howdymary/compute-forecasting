name: Archive derived research results beyond Actions retention
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-archive.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate publication boundary
        run: |
          python -m pip install -e '.[dev]' modal numpy
          python -m pytest tests/test_archive_v2.py
      - name: Await measured finalization and collect derived results
        run: |
          gh run watch 43677709126 --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run download 43665821333 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-*' --dir inputs/campaign
          gh run download 43677499284 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-rl-*' --dir inputs/rl
          gh run download 43665112830 --repo "$GITHUB_REPOSITORY" --name campaign-v2-evidence-bd267f17fa31106a05a22e3b6b4739f7bd6c0327-43665112830 --dir inputs/evidence
          gh run download 43677709126 --repo "$GITHUB_REPOSITORY" --name campaign-v2-final-43677709126 --dir inputs/final
          gh run download 43671941385 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-rl-*' --dir inputs/failed-rl-prefixes
          gh run download 43677120366 --repo "$GITHUB_REPOSITORY" --name campaign-v2-storage-cleanup-43677120366 --dir inputs/storage
      - name: Publish durable derived artifact bundle
        run: modal run -m compute_forecast.archive_v2 --inputs inputs
      - name: Verify the public download and every member checksum
        run: |
          python - <<'PY'
          import hashlib,io,json,urllib.request,zipfile
          from pathlib import Path
          manifest=json.loads(Path('artifacts/v2-archive/manifest.json').read_text())
          raw=urllib.request.urlopen(manifest['url'],timeout=90).read()
          assert hashlib.sha256(raw).hexdigest()==manifest['sha256']
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              index=json.loads(z.read('member-manifest.json'))
              for name,entry in index['members'].items():assert hashlib.sha256(z.read(name)).hexdigest()==entry['sha256']
              assert hashlib.sha256(z.read('archived-official-forecasts.csv')).hexdigest()=='67a043255a716db6bc9b73cd28f9258c30fb299fd8671a9ee3430c0d94cadd80'
              assert len(json.loads(z.read('public-snapshot.json'))['policy_reports'])==9
          print('V2_ARCHIVE_VERIFIED:'+json.dumps({'sha256':manifest['sha256'],'bytes':len(raw),'members':len(manifest['members']),'url':manifest['url']}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-archive-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
