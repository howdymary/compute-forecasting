name: Mochi strict walking clearance probes
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/balanced-v11-clearance.json']
permissions:
  contents: read
concurrency:
  group: mochi-balanced-v11-resource-budget
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,robotics,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Test four candidates with the stricter fixture check
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -u -m mochi.balanced.clearance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-balanced-v11-clearance-${{ github.run_id }}
          path: mochi/artifacts/balance-v11-clearance/
          retention-days: 30
