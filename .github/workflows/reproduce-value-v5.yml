name: Reproduce official Pacific submission without model credentials
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/reproduce-value-v5.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Execute the public one-command implementation on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from compute_forecast.pacific_value_v5 import app,reproduce_and_notices,publish_reproduction
          from compute_forecast.review_v4 import encoded
          with app.run():
              value=reproduce_and_notices.remote()
              receipt=publish_reproduction.remote(value)
          out=Path('artifacts/value-v5-reproduction');out.mkdir(parents=True)
          (out/'reproduction.json').write_bytes(encoded(value['report']))
          notices=out/'notices';notices.mkdir()
          for name,text in value['notices'].items():(notices/name).write_text(text)
          print('VALUE_V5_REPRODUCTION:'+encoded(value['report']).decode(),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: value-v5-reproduction-${{ github.run_id }}
          path: artifacts/value-v5-reproduction/
          retention-days: 90
      - name: Publish exact reproduction and source notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from compute_forecast.publication_v5 import publish
          root=Path('artifacts/value-v5-reproduction')
          files={'results/value-v5/runs/'+os.environ['GITHUB_RUN_ID']+'/'+str(p.relative_to(root)):p.read_bytes() for p in root.rglob('*') if p.is_file()}
          print('VALUE_V5_REPRODUCTION_COMMIT:'+publish(files),flush=True)
          PY
