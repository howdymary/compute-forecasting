name: Verify GPU value and memory arithmetic without credentials
on:
  push:
    branches: [compute-observatory]
    paths:
      - src/compute_forecast/verify_value_v5.py
      - .github/workflows/verify-value-v5.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public source artifacts on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m compute_forecast.verify_value_v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: value-public-verification-${{ github.run_id }}
          path: artifacts/public-value-v5/
          retention-days: 90
      - name: Publish versioned reconstruction receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from compute_forecast.publication_v5 import publish
          p=Path('artifacts/public-value-v5/verification.json')
          print(publish({'results/value-v5/runs/'+os.environ['GITHUB_RUN_ID']+'/'+p.name:p.read_bytes()}),flush=True)
          PY
