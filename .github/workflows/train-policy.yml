name: Train genuine Tinker policy checkpoints

on:
  push:
    branches: [compute-observatory]
    paths:
      - .github/workflows/train-policy.yml
      - src/compute_forecast/policy_warmup.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tinker-policy-warmup
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch pinned source archive on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: gh api "repos/$SOURCE_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and validate the research contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          python -m pytest --junitxml=artifacts/policy-tests.xml

      - name: Install CPU-only hosted dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install modal tinker tinker-cookbook

      - name: Retrieve completed official experiments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43637893251" > inputs/source-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path("inputs/source-run.json").read_text())
          assert run["conclusion"] == "success", "Source experiment did not succeed"
          assert run["head_branch"] == "compute-observatory", "Unexpected source branch"
          assert run["head_sha"] == "61c6e305521f2cb6baa21bce4c101e4495cc721b", "Unexpected source revision"
          PY
          gh run download 43637893251 --repo "$GITHUB_REPOSITORY" --name genuine-starter-61c6e305521f2cb6baa21bce4c101e4495cc721b --dir inputs

      - name: Train LoRA and compare actual saved checkpoints
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python -m compute_forecast.policy_warmup --training-report inputs/starter-training.json --development-report inputs/starter-development.json --output-dir artifacts/policy-warmup --epochs 3

      - name: Record actual hosted dependency versions
        if: always()
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/policy-python-environment.txt

      - name: Preserve training evidence and genuine traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinker-policy-${{ github.sha }}
          path: artifacts/
          retention-days: 30
