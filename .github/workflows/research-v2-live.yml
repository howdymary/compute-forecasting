name: Run an authenticated live research question
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-live.yml]
  workflow_dispatch:
    inputs:
      question:
        type: choice
        options: [calibration, composition]
        default: calibration
      policy:
        type: choice
        options: [development_selected, starting]
        default: development_selected
permissions:
  contents: read
  actions: read
concurrency:
  group: bounded-live-v2-research
  cancel-in-progress: false
jobs:
  live:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
      RESEARCH_QUESTION: ${{ inputs.question || 'calibration' }}
      POLICY_KIND: ${{ inputs.policy || 'development_selected' }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU clients and validate contracts
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' modal numpy tinker tinker-cookbook
          python -m compileall -q src
          python -m pytest tests/test_policy_v2.py tests/test_experimental_v2.py
      - name: Select frozen sampler using development results only
        run: |
          gh run watch 43665821333 --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run download 43665821333 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-policy-*' --dir inputs/policies
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          from compute_forecast.campaign_v2 import protocol,now
          assert datetime.now(timezone.utc)<datetime.fromisoformat(protocol()['compute_policy']['stop_new_campaigns_before'].replace('Z','+00:00')),'Campaign launch cutoff reached'
          reports=[json.loads(p.read_text()) for p in Path('inputs').rglob('policy-report.json')]
          assert len(reports)==6 and all(p['mode']=='sft' and p['actual_optimizer_updates']==100 and p['grid_source_sha']=='a147797ec4557a337e2157ac60857d575e121630' for p in reports)
          def dev(p):return next(c['development_pinball'] for c in p['checkpoints'] if c['update']==p['selected_update'])
          chosen=min(reports,key=lambda p:(dev(p),p['selected_update'],p['seed'],p['objective']))
          checkpoint=next(c for c in chosen['checkpoints'] if c['update']==chosen['selected_update'])
          receipt={'kind':'development_selected_sft','private_manifest_id':chosen['private_manifest_id'],'checkpoint_id':checkpoint['checkpoint_id'],'seed':chosen['seed'],'objective':chosen['objective'],'selected_update':chosen['selected_update'],'development_pinball':dev(chosen),'selected_at':now(),'selection_uses_evaluation':False,'source_run_id':'43665821333','selection_rule':'Lowest development pinball across the six SFT runs; ties use earlier update, then seed and objective','deployment_scope':'Operational training-period demonstration; different observation/evidence context from the controlled selector evaluation'}
          Path('inputs/live-policy.json').write_text(json.dumps(receipt,indent=2))
          Path('artifacts').mkdir(exist_ok=True);Path('artifacts/live-policy-selection.json').write_text(json.dumps({k:v for k,v in receipt.items() if k!='private_manifest_id'},indent=2))
          PY
      - name: Request genuine bounded numerical execution
        run: |
          if [ "$POLICY_KIND" = "development_selected" ]; then
            python -m compute_forecast.autonomy_v2 --question "$RESEARCH_QUESTION" --origin 2026-07-18 --policy-manifest inputs/live-policy.json
          else
            python -m compute_forecast.autonomy_v2 --question "$RESEARCH_QUESTION" --origin 2026-07-18
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-live-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
