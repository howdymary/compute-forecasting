name: Audit Pacific value-study primary documents
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/pacific-audit-v5.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch immutable source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Inspect licenses, exact starter definitions and schema on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.pack_audit_v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pacific-audit-v5-${{ github.run_id }}
          path: artifacts/pacific-v5/
          retention-days: 90
