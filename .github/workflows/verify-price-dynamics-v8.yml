name: Reconstruct public price-dynamics arithmetic without credentials
on:
  push:
    branches: [compute-observatory]
    paths:
      - .github/workflows/verify-price-dynamics-v8.yml
      - src/compute_forecast/verify_price_dynamics_v8.py
      - results/price-dynamics-v8/runs/*/study.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m compute_forecast.verify_price_dynamics_v8 results/price-dynamics-v8/runs/43785185915/study.json
