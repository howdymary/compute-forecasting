name: Deploy matched forecasting evidence study v14
on:
  push:
    branches: [compute-observatory]
    paths: ['src/compute_forecast/evidence_ui_v14.py', 'src/compute_forecast/evidence_web_v14.py', '.github/workflows/deploy-evidence-v14.yml']
  workflow_run:
    workflows: [Publish matched evidence forecasting research v14]
    types: [completed]
    branches: [compute-observatory]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-v14-readonly-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch current source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Deploy read-only paired figures
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy -m compute_forecast.evidence_web_v14
      - name: Verify live study identity and source boundaries
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://howdymary--compute-forecast-evidence-v14-web.us-east.modal.run'
          with urllib.request.urlopen(base+'/health',timeout=90) as r:health=json.load(r)
          assert health['study_id']=='direct-evidence-v14'
          with urllib.request.urlopen(base+'/api/evidence-v14',timeout=90) as r:report=json.load(r)
          assert report['study_id']=='direct-evidence-v14' and not report['news_used']
          assert not report['audit']['protected_outcomes_loaded']
          PY
