name: Deploy matched forecasting evidence study v14
on:
  push:
    branches: [compute-observatory]
    paths: ['src/compute_forecast/continuation_ui_v21.py','src/compute_forecast/continuation_web_v21.py','src/compute_forecast/quantile_ui_v20.py','src/compute_forecast/quantile_web_v20.py','src/compute_forecast/market_ui_v19.py','src/compute_forecast/market_web_v19.py','src/compute_forecast/evidence_ui_v14.py', 'src/compute_forecast/evidence_web_v14.py', 'src/compute_forecast/probability_ui_v18.py', 'src/compute_forecast/probability_web_v18.py', '.github/workflows/deploy-evidence-v14.yml']
  workflow_run:
    workflows: [Train categorical CE continuation v21, Expand categorical continuation after development gate v21, Issue registered categorical continuation forecasts v21,Publish matched evidence forecasting research v14, Publish direct probability forecasts v18, Publish matched market-state study v19, Publish measured market-state training progress v19, Issue registered market-state forecasts v19, Train direct quantile-head pilot v20, Expand quantile-head pilot only after development gate v20, Issue registered quantile forecasts v20]
    types: [completed]
    branches: [compute-observatory]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-v14-readonly-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch current source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/compute-observatory" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
          echo "EVIDENCE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal 'httpx[http2]==0.28.1'
      - name: Mirror both verified publications before serving
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.probability_serving_v18
      - name: Deploy read-only paired figures
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy -m compute_forecast.evidence_web_v14
      - name: Verify live study identity and source boundaries
        run: |
          python - <<'PY'
          import json
          from compute_forecast.ui_http_v18 import live_urlopen
          base='https://howdymary--compute-forecast-evidence-v14-web.us-east.modal.run'
          with live_urlopen(base+'/health',timeout=90) as r:health=json.load(r)
          assert health['study_id']=='direct-evidence-v14'
          with live_urlopen(base+'/api/evidence-v14',timeout=90) as r:report=json.load(r)
          assert report['study_id']=='direct-evidence-v14' and not report['news_used']
          assert not report['audit']['protected_outcomes_loaded']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-serving-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/forecast-serving
          retention-days: 30
