name: Verify complete Pacific pack access
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/data-access-v4.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch source on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Read-only private-volume audit
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.data_access_audit_v4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pacific-access-v4-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
