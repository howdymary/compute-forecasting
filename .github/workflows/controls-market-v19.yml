name: Execute matched numerical controls v19
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/controls-market-v19.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: market-state-v19-controls
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch fixed source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Retrieve audited input identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44040999343 --repo "$GITHUB_REPOSITORY" --name market-state-v19-readiness-44040999343-1 --dir inputs/market-state-v19
      - name: Run unchanged starter and matched numerical learner on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.market_controls_v19
      - name: Publish matched controls
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/market-state-v19-controls
          V18_PUBLIC_KIND: controls
        run: python scripts/publish_market_v19.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-state-v19-controls-${{ github.run_id }}
          path: artifacts/market-state-v19-controls
          retention-days: 180
