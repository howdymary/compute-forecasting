name: Validate direct forecast figures without recording
on:
  push:
    branches: [compute-observatory]
    paths: ['src/compute_forecast/direct_ui_v12.py', 'src/compute_forecast/direct_web_v12.py', 'scripts/validate_direct_v12_ui.py', 'results/direct-v12/**', '.github/workflows/validate-direct-v12-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: direct-v12-ui-validation
  cancel-in-progress: false
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pinned source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install remote validation dependencies
        run: |
          python -m pip install -e '.[dev]' modal numpy playwright
          python -m playwright install --with-deps chromium
      - name: Verify scientific contracts and JavaScript syntax
        run: |
          python -m compileall -q src scripts
          python -m pytest --junitxml=artifacts/direct-v12-ui-tests.xml
          mkdir -p artifacts/direct-v12-ui
          python - <<'PY'
          from pathlib import Path
          from compute_forecast.direct_ui_v12 import HTML
          assert HTML.count('<script>')==1 and HTML.count('</script>')==1
          Path('artifacts/direct-v12-ui/script.js').write_text(HTML.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check artifacts/direct-v12-ui/script.js
      - name: Inspect actual desktop and mobile flows using PNGs only
        run: PYTHONPATH=src python scripts/validate_direct_v12_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-v12-ui-${{ github.run_id }}
          path: artifacts/direct-v12-ui
          retention-days: 30
