name: Preserve model checkpoints while reclaiming redundant initial optimizer copies
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-initial-retention.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
    steps:
      - name: Fetch immutable retention policy
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reported samplers, then remove only zero-update optimizer duplicates
        run: |
          python -m pip install -e . modal tinker
          modal run -m compute_forecast.initial_optimizer_retention_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-initial-retention-${{ github.run_id }}
          path: artifacts/v2-retention/
          retention-days: 30
