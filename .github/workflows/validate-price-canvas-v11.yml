name: Validate single price canvas without recording
on:
  workflow_run:
    workflows: ["Deploy pricing observatory"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: (github.event_name != 'workflow_run' && github.ref == 'refs/heads/compute-observatory') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'compute-observatory')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium
          python -m compute_forecast.validate_price_canvas_v11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-canvas-v11-ui-${{ github.run_id }}
          path: artifacts/price-canvas-v11/
          retention-days: 90
      - name: Publish verified dashboard report and PNGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from compute_forecast.publication_canvas_v11 import publish
          root=Path('artifacts/price-canvas-v11')
          print('C11_PUBLICATION:'+publish({'results/price-canvas-v11/runs/'+os.environ['GITHUB_RUN_ID']+'/'+str(p.relative_to(root)):p.read_bytes() for p in root.rglob('*') if p.is_file()}),flush=True)
          PY
