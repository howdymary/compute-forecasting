name: Mochi walking task and arm recovery post-training
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/control-v8-protocol.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: mochi-control-v8
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned runtime and robot assets
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Check physics and decision contracts
        run: python -m pytest mochi/tests/test_control_v8.py -q
      - name: Restore frozen measured training branches when configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mochi_source_run=$(python -c 'import json;print(json.load(open("mochi/configs/control-v8-protocol.json")).get("source_dataset_run",0))')
          if [ "$mochi_source_run" != "0" ]; then
            gh run download "$mochi_source_run" --repo "$GITHUB_REPOSITORY" --dir mochi/.cache/control-reuse
          fi
      - name: Measure labels, resume Tinker, train and evaluate all six domains
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.control_v8.train
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-control-v8-${{ github.run_id }}
          path: mochi/artifacts/control-v8/
          retention-days: 30
