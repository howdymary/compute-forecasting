name: Collect supplementary market context v4
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/market-context-v4.yml]
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * 1'
permissions:
  contents: read
concurrency:
  group: market-context-v4
  cancel-in-progress: false
jobs:
  market:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check finite supplementary collection window
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone
          active='2026-11-15'<=datetime.now(timezone.utc).date().isoformat()<='2027-01-20'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('active='+str(active).lower()+'\n')
          PY
      - name: Install CPU inference clients on hosted runner
        if: steps.window.outputs.active == 'true'
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' modal numpy scipy scikit-learn tinker==0.39.0 tinker-cookbook==0.6.1 transformers==5.23.0 httpx
          python -m compileall -q src
          python -m pytest tests/test_prospective_v4.py --junitxml=artifacts/market-context-contracts.xml
      - name: Retain a licensed price vintage with an explicit collection receipt
        if: steps.window.outputs.active == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.review_remote_v4 --mode capture
      - name: Retrieve primary sources and make two bounded research decisions
        if: steps.window.outputs.active == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -m compute_forecast.review_remote_v4 --mode market
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-context-v4-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
      - name: Publish source metadata and research decisions to GitHub
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from compute_forecast.review_v4 import encoded,publish_append_only
          value=json.loads(Path('artifacts/review-v4-operations/market.json').read_bytes())
          path='results/review-v4/market/'+os.environ['GITHUB_RUN_ID']+'.json'
          files={path:encoded(value)}
          runtime=json.loads(Path('artifacts/review-v4-operations/runtime-contract.json').read_bytes())
          files['results/review-v4/runtime/'+os.environ['GITHUB_RUN_ID']+'.json']=encoded(runtime)
          capture=json.loads(Path('artifacts/review-v4-operations/capture.json').read_bytes())
          files['results/review-v4/vintages/'+os.environ['GITHUB_RUN_ID']+'.json']=encoded(capture)
          print('V4_MARKET_COMMIT:'+publish_append_only(files),flush=True)
          PY
    permissions:
      contents: write
