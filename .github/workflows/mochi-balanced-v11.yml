name: Mochi balanced desk research
on:
  workflow_dispatch:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/balanced-v11-launch.json']
permissions:
  contents: read
concurrency:
  group: mochi-balanced-v11
  cancel-in-progress: false
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install isolated Mochi runtime
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev,robotics]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Test failure-directed bounded proposals
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.balanced.research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-balanced-v11-${{ github.run_id }}
          path: mochi/artifacts/balance-v11-remote/
          retention-days: 30
