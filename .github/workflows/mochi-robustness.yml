name: Mochi expanded sponsor robustness study
on:
  push:
    branches: [mochi-hackathon]
    paths: ['mochi/src/mochi/robustness.py', '.github/workflows/mochi-robustness.yml']
permissions:
  contents: read
concurrency:
  group: mochi-robustness-v2
  cancel-in-progress: false
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install service clients
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]'
      - name: Expanded eight-round research and family-matched control
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -m mochi.robustness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-robustness-${{ github.run_id }}
          path: mochi/artifacts/robustness-v2/
          retention-days: 30
