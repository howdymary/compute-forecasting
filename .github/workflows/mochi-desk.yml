name: Mochi desk policy training
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/scripts/desk_probe.py', 'mochi/src/mochi/desk/train.py', '.github/workflows/mochi-desk.yml']
permissions:
  contents: read
concurrency:
  group: mochi-desk-v3
  cancel-in-progress: false
jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned training and simulation clients
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]'
      - name: Verify backend services
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python mochi/scripts/desk_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-desk-${{ github.run_id }}
          path: mochi/artifacts/desk-v3/
          retention-days: 30
