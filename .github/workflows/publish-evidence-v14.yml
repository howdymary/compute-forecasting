# Publish the training-versus-base negative finding alongside the matched BLS comparison.
# Publish immutable blobs once; verify the fresh tree and use nonforce updates for branch concurrency.
# Complete artifacts are verified independently; a post-result process exit never triggers repeated optimization.
# Four completed runs can be reconstructed without waiting for the final pair; optimizer jobs are untouched.
# Publish only retained completed runs; partial publication never starts or repeats optimization.
name: Publish matched evidence forecasting research v14
on:
  workflow_run:
    workflows: [Train matched price and BLS forecasting models v14]
    types: [completed]
    branches: [compute-observatory]
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/publish-evidence-v14.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: evidence-v14-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRAINING_RUN_ID: '43966729631'
      PUBLICATION_ID: ${{ github.event.workflow_run.id || '43966729631' }}-publication-${{ github.run_id }}
    steps:
      - name: Fetch current verified publication code
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/compute-observatory" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve frozen inputs and any retained completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,subprocess,time,json,pathlib,shutil
          execution=json.loads(subprocess.check_output(["gh","api","repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["TRAINING_RUN_ID"]],text=True))
          assert execution["head_branch"]=="compute-observatory" and execution["name"]=="Train matched price and BLS forecasting models v14"
          pathlib.Path("inputs/publication").mkdir(parents=True,exist_ok=True)
          pathlib.Path("inputs/publication/workflow.json").write_text(json.dumps({k:execution[k] for k in ("id","name","status","conclusion","head_sha","created_at","updated_at")},indent=2)+"\n")
          for attempt in range(90):
              command=['gh','run','download',os.environ['TRAINING_RUN_ID'],'--repo',os.environ['GITHUB_REPOSITORY'],'--name','evidence-v14-inputs-'+os.environ['TRAINING_RUN_ID'],'--dir','inputs/publication/input']
              p=subprocess.run(command,capture_output=True)
              if p.returncode==0:break
              time.sleep(5)
          else:raise RuntimeError('Qualified paired dataset was not retained; no fabricated report')
          for attempt in range(6):
              destination=pathlib.Path('inputs/publication/runs-attempt-'+str(attempt))
              process=subprocess.run(['gh','run','download',os.environ['TRAINING_RUN_ID'],'--repo',os.environ['GITHUB_REPOSITORY'],'--pattern','evidence-v14-*-seed-*','--dir',str(destination)],capture_output=True)
              if process.returncode==0:
                  destination.rename('inputs/publication/runs');break
              shutil.rmtree(destination,ignore_errors=True)
              time.sleep(5)
          else:raise RuntimeError('Retained training artifacts could not be downloaded; publication refused')
          if execution['status']=='completed':
              assert len(list(pathlib.Path('inputs/publication/runs').rglob('result.json')))==6,'Completed campaign requires all six saved results'
          PY
      - name: Reconstruct source-bound summaries
        run: |
          PYTHONPATH=src python scripts/assemble_evidence_v14.py --inputs inputs/publication --output artifacts/evidence-v14-public
          PYTHONPATH=src python -m compute_forecast.verify_evidence_v14 --results artifacts/evidence-v14-public
      - name: Publish new version without replacing prior studies
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python scripts/publish_evidence_v14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-v14-publication-${{ github.run_id }}
          path: artifacts/evidence-v14-public
          retention-days: 30
