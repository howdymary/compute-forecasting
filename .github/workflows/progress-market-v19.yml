name: Publish measured market-state training progress v19
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/progress-market-v19.yml]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: market-state-v19-progress
  cancel-in-progress: false
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch current code
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/compute-observatory" | tar -xz --strip-components=1
      - name: Stop progress exports after final publication
        id: gate
        run: test -f results/market-state-v19/latest.json || echo "active=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.active == 'true'
        run: python -m pip install -e . modal
      - name: Retrieve only completed untuned and numerical references
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44041295208 --repo "$GITHUB_REPOSITORY" --name market-state-v19-base-44041295208 --dir inputs/market-state-v19
          gh run download 44040999343 --repo "$GITHUB_REPOSITORY" --name market-state-v19-readiness-44040999343-1 --dir inputs/market-state-v19
          gh run download 44041529178 --repo "$GITHUB_REPOSITORY" --name market-state-v19-controls-44041529178 --dir artifacts/market-state-v19-controls
      - name: Export actual durable checkpoint measurements
        if: steps.gate.outputs.active == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.market_live_progress_v19
      - name: Publish labeled in-progress artifacts
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/market-state-v19-progress
          V18_PUBLIC_KIND: progress
        run: python scripts/publish_market_v19.py
