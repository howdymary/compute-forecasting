name: Verify independently licensed upstream history
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/upstream-history-v3.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Fetch immutable source remotely
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Retrieve pre-cutoff upstream data under its explicit license and verify identity
        run: modal run -m compute_forecast.upstream_history_v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-history-candidate-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
