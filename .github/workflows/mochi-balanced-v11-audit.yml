name: Mochi reference audit correction
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/balanced-v11-audit.json']
permissions:
  contents: read
concurrency:
  group: mochi-balanced-v11-resource-budget
  cancel-in-progress: false
jobs:
  close-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install modal==1.6.4 httpx==0.28.1
      - name: Publish the audit verdict without changing trained weights
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PYCODE'
          import json,modal
          correction=json.load(open('mochi/configs/balanced-v11-audit.json'))
          store=modal.Dict.from_name('mochi-balanced-v11-progress')
          report=store.get('latest',{})
          report.update(status='invalid_reference',phase=correction['verdict'],training_gate_open=False,
              audit=json.load(open('mochi/evidence/balance-v11/reference-audit.json')))
          report['budget_usage_or_reserved']=modal.Dict.from_name('mochi-balanced-v11-budget').get('usage',{})
          store.put('latest',report)
          print('Reference gate closed; actual recorded optimizer count:',report.get('optimizer_updates_completed',0))
          PYCODE
      - name: Correct the shared finding and recall it before the next experiment
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.balanced.audit_memory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-balanced-v11-audit-memory-${{ github.run_id }}
          path: mochi/artifacts/balance-v11-audit-memory/
          retention-days: 30
