name: Mochi walking and task post-training
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/curriculum-phase.json', '.github/workflows/mochi-curriculum.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: mochi-curriculum-v6
  cancel-in-progress: false
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install service client
        run: python -m pip install tinker==0.39.0
      - name: Read configured phase
        id: phase
        run: echo "phase=$(python -c 'import json;print(json.load(open("mochi/configs/curriculum-phase.json"))["phase"])')" >> "$GITHUB_OUTPUT"
      - name: Check authenticated Tinker availability
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u mochi/scripts/curriculum_probe.py
      - name: Inspect checkpoint storage without mutation
        if: steps.phase.outputs.phase == 'storage'
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -u mochi/scripts/check_tinker_storage.py
      - name: Install curriculum runtime
        if: contains(fromJSON('["train","resume","evaluate"]'), steps.phase.outputs.phase)
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Restore completed contact trials if configured
        if: steps.phase.outputs.phase == 'train'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mochi_contact_run=$(python -c 'import json;print(json.load(open("mochi/configs/curriculum-phase.json")).get("reuse_contact_run", ""))')
          if [ -n "$mochi_contact_run" ]; then
            gh run download "$mochi_contact_run" --repo "$GITHUB_REPOSITORY" --dir mochi/.cache/bootstrap
          fi
      - name: Restore the saved training campaign
        if: contains(fromJSON('["resume","evaluate"]'), steps.phase.outputs.phase)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mochi_resume_run=$(python -c 'import json;print(json.load(open("mochi/configs/curriculum-phase.json"))["resume_source_run"])')
          gh run download "$mochi_resume_run" --repo "$GITHUB_REPOSITORY" --dir mochi/.cache/resume-source
      - name: Publish credential-free numerical monitor
        if: contains(fromJSON('["train","resume","evaluate"]'), steps.phase.outputs.phase)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m modal deploy -m mochi.curriculum.remote
      - name: Train walking and manipulation decisions
        if: steps.phase.outputs.phase == 'train'
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.curriculum.train
      - name: Resume the durable optimizer checkpoint
        if: steps.phase.outputs.phase == 'resume'
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.curriculum.resume
      - name: Complete saved checkpoint evaluation without training
        if: steps.phase.outputs.phase == 'evaluate'
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.curriculum.finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-curriculum-${{ github.run_id }}
          path: mochi/artifacts/curriculum/
          retention-days: 30
