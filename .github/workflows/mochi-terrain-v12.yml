name: Mochi terrain controller research
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/terrain-v12-launch.json']
permissions:
  contents: read
concurrency:
  group: mochi-terrain-v12-resource-budget
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,robotics,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
          python -m pytest -q mochi/tests/test_terrain_v12.py mochi/tests/test_balanced_v11.py
      - name: Research and test the measured controller failure
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.terrain_v12.research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-terrain-v12-research-${{ github.run_id }}
          path: mochi/artifacts/terrain-v12-research/
          retention-days: 30
