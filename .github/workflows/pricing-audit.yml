name: Inspect pricing catalog metadata
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [src/compute_forecast/pricing_audit.py, .github/workflows/pricing-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch pinned source remotely
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Inspect metadata without historical price publication
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.pricing_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-metadata-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
