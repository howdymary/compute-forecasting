name: Run registered review v4 operations
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/review-v4-operations.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: review-v4-registered-operations
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch immutable source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run existing and new scientific contract checks
        run: |
          python -m pip install -e '.[dev]' modal numpy scipy scikit-learn
          python -m compileall -q src
          python -m pytest --junitxml=artifacts/review-v4-contracts.xml
          python - <<'PY'
          from pathlib import Path
          from compute_forecast.explore_ui import HTML
          Path('artifacts/review-v4-ui.js').write_text(HTML.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check artifacts/review-v4-ui.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-v4-contracts-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
  initialize:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal numpy
      - name: Retain vintage, audit training readiness and evaluate registered interval diagnostic on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.review_remote_v4 --mode initialize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-v4-initialize-${{ github.run_id }}
          path: artifacts/review-v4-operations/
          retention-days: 30
  feedback:
    needs: initialize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch the same registered source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU policy clients on hosted runner
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . modal numpy scipy scikit-learn tinker tinker-cookbook httpx
      - name: Record client versions
        run: |
          mkdir -p artifacts/review-v4-operations
          python -m pip freeze > artifacts/review-v4-operations/client-versions.txt
      - name: Run the registered matched inference experiment with Exa and authored memory
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -m compute_forecast.review_remote_v4 --mode feedback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-v4-feedback-${{ github.run_id }}
          path: artifacts/review-v4-operations/
          retention-days: 30
  publish:
    needs: [initialize,feedback]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact source and measured artifacts
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name "review-v4-initialize-${{ github.run_id }}" --dir inputs/initialize
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name "review-v4-feedback-${{ github.run_id }}" --dir inputs/feedback
          gh run download 43749203252 --repo "$GITHUB_REPOSITORY" --name pacific-access-v4-43749203252 --dir inputs/access
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Publish versioned allowlisted results with fresh-head verification
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from compute_forecast.review_v4 import encoded,publish_files
          from compute_forecast.public_results import private_guard
          run=os.environ['GITHUB_RUN_ID'];files={}
          for folder,names in [('initialize',['initialize.json']),('feedback',['feedback.json']),('access',['pacific-access-v4.json'])]:
              for name in names:
                  path=Path('inputs')/folder/name;value=json.loads(path.read_bytes());private_guard(value)
                  files['results/review-v4/operations/'+run+'/'+name]=encoded(value)
          files['results/review-v4/operations-index.json']=encoded({'schema_version':4,'source_sha':os.environ['GITHUB_SHA'],'workflow_run_id':run,'files':{p:{'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)} for p,raw in files.items()},'future_outcomes':'pending','new_optimizer_updates':0})
          print('V4_OPERATIONS_COMMIT:'+publish_files(files),flush=True)
          PY
