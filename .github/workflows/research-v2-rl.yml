name: Run gated three-seed reward learning
run-name: V2 reward learning · ${{ inputs.controller_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      controller_id:
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: registered-v2-rl
  cancel-in-progress: false
jobs:
  rl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [17, 29, 43]
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install clients and verify contracts
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' modal numpy scipy scikit-learn tinker tinker-cookbook
          python -m compileall -q src
          python -m pytest tests/test_policy_v2.py tests/test_experimental_v2.py tests/test_rl_gate_v2.py
      - name: Await the complete controlled SFT campaign
        run: |
          gh run watch 43665821333 --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run download 43665821333 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-*' --dir inputs/campaign
          gh run download 43665112830 --repo "$GITHUB_REPOSITORY" --name campaign-v2-evidence-bd267f17fa31106a05a22e3b6b4739f7bd6c0327-43665112830 --dir inputs/evidence
      - name: Freeze parent selection using development loss only
        id: parent
        env:
          TRAINING_SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          from compute_forecast.campaign_v2 import protocol
          assert datetime.now(timezone.utc)<datetime.fromisoformat(protocol()['compute_policy']['stop_new_campaigns_before'].replace('Z','+00:00'))
          reports=[json.loads(p.read_text()) for p in Path('inputs').rglob('policy-report.json')]
          assert len(reports)==6 and all(r['mode']=='sft' and r['actual_optimizer_updates']==100 for r in reports)
          options=[r for r in reports if r['seed']==int(os.environ['TRAINING_SEED'])]
          def dev(r):return next(c['development_pinball'] for c in r['checkpoints'] if c['update']==r['selected_update'])
          best=min(options,key=lambda r:(dev(r),r['objective']))
          receipt={'seed':best['seed'],'parent_manifest_id':best['private_manifest_id'],'parent_objective':best['objective'],'development_pinball':dev(best),'selection_rule':'lowest development score within seed, objective alphabetic tie break','selection_uses_evaluation':False,'frozen_at':datetime.now(timezone.utc).isoformat()}
          Path('artifacts').mkdir(exist_ok=True);Path('artifacts/rl-parent-freeze.json').write_text(json.dumps(receipt,indent=2))
          Path('inputs/grid.json').write_text(next(Path('inputs/campaign').rglob('grid.json')).read_text())
          Path('inputs/evidence.json').write_text(next(Path('inputs/evidence').rglob('evidence.json')).read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('manifest='+best['private_manifest_id']+'\nobjective='+best['objective']+'\n')
          PY
      - name: Test reachable reward variation then sample actual trajectories
        run: modal run -m compute_forecast.policy_v2 --grid inputs/grid.json --evidence inputs/evidence.json --mode rl --objective ${{ steps.parent.outputs.objective }} --seed ${{ matrix.seed }} --parent ${{ steps.parent.outputs.manifest }} --max-updates 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-rl-${{ matrix.seed }}
          path: artifacts/
          retention-days: 30
  publish:
    needs: rl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CAMPAIGN_STATUS: completed
      CAMPAIGN_RUN_ID: '43665821333'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gather and publish all actual results
        run: |
          python -m pip install -e . modal numpy
          gh run download 43665821333 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-*' --dir inputs/campaign
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-rl-*' --dir inputs/rl
          gh run download 43665112830 --repo "$GITHUB_REPOSITORY" --name campaign-v2-evidence-bd267f17fa31106a05a22e3b6b4739f7bd6c0327-43665112830 --dir inputs/evidence
          modal run -m compute_forecast.experimental_v2 --inputs inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-rl-publication-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
