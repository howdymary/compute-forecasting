name: Mochi read-only planning preflight
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/planning-audit.json']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install tinker==0.39.0
      - name: Read storage inventory without training or mutations
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -u -m mochi.planning.preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-planning-preflight-${{ github.run_id }}
          path: mochi/artifacts/planning/storage-private.json
          retention-days: 30
