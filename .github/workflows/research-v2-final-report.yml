name: Publish final measured findings after verified archive
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-final-report.yml, src/compute_forecast/final_findings_v2.py, tests/test_final_findings_v2.py]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v2-final-report-publication
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch immutable report generator
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify publication boundaries before waiting
        run: |
          python -m pip install -e '.[dev]' modal
          python -m compileall -q src
          python -m pytest tests/test_final_findings_v2.py tests/test_archive_v2.py tests/test_resume_v2.py
      - name: Await actual verification and immutable artifact publication
        run: |
          gh run watch 43677709126 --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run watch 43677783872 --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - name: Publish derived findings with a fresh branch head and no force update
        run: python -m compute_forecast.final_findings_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-final-publication-${{ github.run_id }}
          path: artifacts/v2-final-report/
          retention-days: 30
