name: Publish BoundForge comparative study
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/boundforge-v2-publish.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for independent campaign check
        run: gh run watch 43675810337 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
      - name: Install verification and artifact dependencies
        run: |
          python -m pip install -r boundforge/requirements.txt matplotlib playwright
          python -m playwright install --with-deps chromium
      - name: Check research sources
        run: |
          python -m compileall -q boundforge/research_v2
          python -m pytest -q -p no:cacheprovider boundforge/research_v2/test_v2.py
      - name: Recheck and publish actual study
        run: python -u boundforge/research_v2/publish.py --run 43675810337 --publish
      - name: Check and publish paired follow-up
        run: python -u boundforge/research_v2/publish_followup.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundforge-v2-published-study
          path: |
            boundforge/research_v2/output/
            boundforge/research_v2/followup/
          retention-days: 30
