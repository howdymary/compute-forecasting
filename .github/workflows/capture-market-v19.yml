name: Capture continuing market quotes v19
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/capture-market-v19.yml]
  schedule:
    - cron: '40 17,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-state-v19-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch current registered source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/compute-observatory" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Retain immutable source-day vintages
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.capture_market_v19
      - name: Publish attributed observations and collection provenance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/market-state-v19-capture
          V18_PUBLIC_KIND: captures
        run: python scripts/publish_market_v19.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-state-v19-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/market-state-v19-capture
          retention-days: 30
