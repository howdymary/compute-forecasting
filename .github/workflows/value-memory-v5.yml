name: Run source-grounded GPU value memory research
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/value-memory-v5.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: value-memory-v5
  cancel-in-progress: false
jobs:
  memory:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V5_STUDY_FILE: results/value-v5/runs/43757456253/study.json
    steps:
      - name: Fetch immutable source and completed study
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU policy clients remotely
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . modal numpy tinker==0.39.0 tinker-cookbook==0.6.1 transformers==5.23.0 httpx
      - name: Execute three model-driven roles with verified cross-role recall
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -m compute_forecast.memory_value_v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: value-memory-v5-${{ github.run_id }}
          path: artifacts/value-memory-v5/
          retention-days: 90
      - name: Publish authored records, recalls and measured decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from compute_forecast.publication_v5 import publish
          files={'results/value-v5/runs/'+os.environ['GITHUB_RUN_ID']+'/'+p.name:p.read_bytes() for p in Path('artifacts/value-memory-v5').glob('*.json')}
          print('VALUE_MEMORY_V5_COMMIT:'+publish(files),flush=True)
          PY
