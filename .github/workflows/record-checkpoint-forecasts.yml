name: Render synchronized checkpoint price forecasts
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [configs/checkpoint-forecast-video.json]
permissions:
  contents: write
concurrency:
  group: synchronized-checkpoint-forecast-video
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact render source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install remote rendering tools
        run: |
          python -m pip install -e . playwright==1.65.2 pillow==13.0.0 modal==1.6.4
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m compileall -q src/compute_forecast/record_checkpoint_forecasts.py
      - name: Verify saved forecast mappings and synchronize all 900 frames
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: python -m compute_forecast.record_checkpoint_forecasts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synchronized-checkpoint-forecasts-${{ github.run_id }}
          path: artifacts/checkpoint-forecast-video/
          retention-days: 90
