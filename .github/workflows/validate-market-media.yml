name: Validate public market figure and real-time playback
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [configs/market-media-validation.json]
permissions:
  contents: write
concurrency:
  group: market-media-public-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact validation source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser validation tools remotely
        run: |
          python -m pip install -e . playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Validate the public figure and play the actual MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m compute_forecast.validate_market_media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-public-validation-${{ github.run_id }}
          path: artifacts/market-media-validation/
          retention-days: 90
