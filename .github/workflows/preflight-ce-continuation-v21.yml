name: Verify incumbent restoration and continuation inputs v21
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/preflight-ce-continuation-v21.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ce-continuation-v21-preflight
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse pinned supported environment
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/market-state-v19.txt
          python -m pip install -e . --no-deps
          python -m compileall -q src scripts
      - name: Bind immutable data preparation
        run: |
          mkdir -p artifacts/ce-continuation-v21-preflight
          python - <<'PY'
          import json,pathlib,shutil
          p=json.loads(pathlib.Path('configs/ce-continuation-v21-inputs.json').read_bytes())
          for source,name in ((p['input_pointer_path'],'input-key.json'),(p['audit_path'],'audit.json')):
              shutil.copyfile(source,'artifacts/ce-continuation-v21-preflight/'+name)
          PY
      - name: Load private corpus by verified identity
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python scripts/load_continuation_inputs_v21.py
      - name: Restore exact saved weights and optimizer; verify forecasts
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python scripts/preflight_continuation_v21.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ce-continuation-v21-preflight-${{ github.run_id }}
          path: artifacts/ce-continuation-v21-preflight
          retention-days: 90
      - name: Publish honest restoration readiness
        env:
          GH_TOKEN: ${{ github.token }}
          V21_PUBLIC_ROOT: artifacts/ce-continuation-v21-preflight
          V21_PUBLIC_KIND: preflight
        run: python scripts/publish_continuation_v21.py
