name: Verify forecasts with official scorer v18
on:
  push:
    branches: [compute-observatory]
    paths: ['.github/workflows/verify-probability-v18-native.yml','src/compute_forecast/probability_official_v18.py']
  workflow_run:
    workflows: [Publish direct probability forecasts v18]
    types: [completed]
    branches: [compute-observatory]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probability-v18-native-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch source and immutable forecast artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/compute-observatory" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
          echo "PUBLICATION_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Run the unmodified official scorer on identical cells
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.probability_official_v18
      - name: Publish source-bound native score agreement
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/probability-v18-native
          V18_PUBLIC_KIND: native-validation
        run: python scripts/publish_probability_v18.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probability-v18-native-${{ github.run_id }}
          path: artifacts/probability-v18-native
          retention-days: 30
