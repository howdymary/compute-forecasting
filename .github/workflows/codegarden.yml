name: CodeGarden closed plateau component
on:
  push:
    branches: [codegarden-radius34]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-radius-probe
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  plateau-component:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact sparse enumerator
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase2/radius_sweep.cpp -o codegarden/.build/radius_sweep
      - name: Enumerate plateau component and check the next reached state
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python -B -u codegarden/phase2/plateau_component.py
