name: CodeGarden multi-family union optimization
on:
  push:
    branches: [codegarden-fusion-003]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-free-fusion
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [0, 1, 2, 3]
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated exact solver
        run: |
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install -r codegarden/requirements-exact.txt
      - name: Maximize pool cardinality from the feasible 226-word hint
        run: codegarden/.venv/bin/python -B -u codegarden/phase3/fusion.py --case ${{ matrix.case }}
      - name: Retain verified witness and exact candidate pool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-fusion-${{ matrix.case }}
          path: codegarden/artifacts/phase3/fusion_001/
  collect:
    needs: optimize
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          pattern: codegarden-fusion-*
          merge-multiple: true
          path: codegarden/artifacts/phase3/fusion_001/
      - name: Publish all bounded union results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B codegarden/phase3/publish_fusion.py
