name: CodeGarden exact polish of new basins
on:
  push:
    branches: [codegarden-polish-003]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-free-polish
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CODEGARDEN_VALID_KERNEL: codegarden/.build/kernel_v2
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile protected-output search and install isolated exact solver
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase2/kernel_v2.cpp -o codegarden/.build/kernel_v2
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install -r codegarden/requirements-exact.txt
      - name: Project and exactly polish archived near-feasible states
        run: codegarden/.venv/bin/python -B -u codegarden/phase3/polish_short.py
      - name: Publish source-backed outcomes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B codegarden/phase3/publish_short.py
      - name: Retain all accepted witnesses and scoped solver outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-short-polish
          path: codegarden/artifacts/phase3/short_polish_001/
