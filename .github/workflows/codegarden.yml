name: CodeGarden isolated verification
on:
  push:
    branches: [codegarden]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-only
  cancel-in-progress: false
env:
  HF_HOME: ${{ github.workspace }}/codegarden/.cache/huggingface
  XDG_CACHE_HOME: ${{ github.workspace }}/codegarden/.cache
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated verification and reporting clients
        run: |
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install -r codegarden/requirements-providers.txt -r codegarden/requirements-report.txt
      - name: Close this one bounded campaign and refresh current records
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Finalize bounded CodeGarden phase-two')
        env:
          GH_TOKEN: ${{ github.token }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CODEGARDEN_FINAL_RECORD_QUERY: '1'
        run: codegarden/.venv/bin/python -B -u codegarden/phase2/closeout.py
      - name: Verify protected boundary and retained exported data
        run: |
          codegarden/.venv/bin/python -B -m unittest discover -s codegarden/tests -v
          codegarden/.venv/bin/python -B -u codegarden/ci/final_check.py
          g++ -std=c++17 -fsyntax-only codegarden/phase2/kernel_v2.cpp
          g++ -std=c++17 -fsyntax-only codegarden/phase2/radius_sweep.cpp
          g++ -std=c++17 -fsyntax-only codegarden/phase2/neutral_kernel.cpp
      - name: Check scope-keyed reuse and generate evidence tables and figures
        run: |
          codegarden/.venv/bin/python -B codegarden/phase2/exhaustion_index.py
          codegarden/.venv/bin/python -B -u codegarden/phase2/report.py
      - name: Publish this campaign's verification and demo
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Finalize bounded CodeGarden phase-two')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: codegarden/.venv/bin/python -B codegarden/phase2/final_publish.py
      - name: Retain closeout evidence even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-phase2-closeout
          path: |
            codegarden/artifacts/
            codegarden/budget/phase2-usage-summary.json
            codegarden/demo/
            !codegarden/artifacts/**/environment.txt
          retention-days: 30
