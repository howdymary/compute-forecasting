name: CodeGarden global elastic packing
on:
  push:
    branches: [codegarden-soft-global-003]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-free-exact
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  global-elastic:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated exact solver
        run: |
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install -r codegarden/requirements-exact.txt
      - name: Verify dominance certificates and test full reduced-universe target packing
        run: codegarden/.venv/bin/python -B -u codegarden/phase3/soft_global.py
      - name: Publish experiment and all diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B codegarden/phase3/publish_soft.py
      - name: Retain exact-search evidence even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-soft-global
          path: codegarden/artifacts/phase3/soft_global_001/
