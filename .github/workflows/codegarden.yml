name: CodeGarden independent repair audit
on:
  push:
    branches: [codegarden-radius34]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-radius-probe
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild pools using protected strings and independently verify all negative repairs
        run: python -B -u codegarden/phase2/audit_certificates.py
      - name: Publish independent audit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python -B codegarden/phase2/publish_audit.py
