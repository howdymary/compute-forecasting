name: CodeGarden retain global findings in memory
on:
  push:
    branches: [codegarden-side-global-memory-001]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
env:
  SOURCE_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  remember:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch isolated memory-post source and verified data
        run: |
          python3 -B - <<'PY'
          import os,pathlib,urllib.request
          for name in ["codegarden/side_global/post_memory.py","codegarden/side_services/cycle.py","codegarden/supervisor.py","codegarden/protected/manifest.json","codegarden/protected/verify_descendants.py","codegarden/protected/verify_lcs.py","codegarden/artifacts/side_research/global_001/summary.json","codegarden/artifacts/side_research/global_001/next_hypothesis.json"]:
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/howdymary/compute-forecasting/"+os.environ["SOURCE_SHA"]+"/"+name,timeout=30).read())
          PY
      - name: Store verified findings and poll the same ingestion handle
        env:
          GH_TOKEN: ${{ github.token }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python3 -B -u codegarden/side_global/post_memory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-global-memory
          retention-days: 30
          path: codegarden/artifacts/side_research/global_memory_001/
