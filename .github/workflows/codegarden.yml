name: CodeGarden recorded demo browser verification
on:
  push:
    branches: [codegarden-demo-qa-003]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-free-demo-qa-003
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  TMPDIR: ${{ github.workspace }}/codegarden/.tmp
  PIP_CACHE_DIR: ${{ github.workspace }}/codegarden/.cache/pip
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/codegarden/.cache/playwright
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
          mkdir -p codegarden/.tmp codegarden/.cache/pip codegarden/.cache/playwright
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pinned browser client
        run: |
          python -m venv codegarden/.venv-demo
          codegarden/.venv-demo/bin/python -m pip install playwright==1.56.0
          codegarden/.venv-demo/bin/python -m playwright install chromium
      - name: Verify browser demo and exported witness
        run: codegarden/.venv-demo/bin/python -B -u codegarden/phase3/demo_qa.py
      - name: Publish own QA evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B codegarden/phase3/publish_demo_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-demo-qa
          retention-days: 1
          path: codegarden/artifacts/phase3/demo_qa_003/
