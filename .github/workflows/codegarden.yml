name: CodeGarden Kakeya deeper local and direction-band pilot
on:
  push:
    branches: [codegarden-kakeya-pilot-002]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-kakeya-pilot-002
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HOME: ${{ github.workspace }}/codegarden/.cache/huggingface
  XDG_CACHE_HOME: ${{ github.workspace }}/codegarden/.cache
  TMPDIR: ${{ github.workspace }}/codegarden/.tmp
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_candidate: ${{ steps.pilot.outputs.has_candidate }}
    steps:
      - name: Fetch isolated source and frozen witnesses
        run: |
          python3 -B - <<'PY'
          import pathlib,urllib.request,os
          pathlib.Path("codegarden/.tmp").mkdir(parents=True,exist_ok=True)
          names=["area.cpp","search.py","tests.py","verify.py","pilot.py","requirements.txt","baseline.json","pilot001_diagnosis.json","protected/manifest.json","protected/official.py","protected/independent.py","protected/__init__.py"]
          for name in ["codegarden/kakeya/"+n for n in names]+["codegarden/side_services/cycle.py","codegarden/supervisor.py","codegarden/protected/manifest.json","codegarden/protected/verify_descendants.py","codegarden/protected/verify_lcs.py"]:
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/howdymary/compute-forecasting/"+os.environ["SOURCE_SHA"]+"/"+name,timeout=45).read())
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated clients and numeric dependencies
        run: |
          python3 -m venv codegarden/.venv-kakeya
          codegarden/.venv-kakeya/bin/python -m pip install --disable-pip-version-check -r codegarden/kakeya/requirements.txt
      - name: Compile and independently check proposal kernel before remote work
        run: |
          mkdir -p codegarden/kakeya/.build codegarden/artifacts/kakeya/pilot_002
          g++ -O3 -std=c++17 -shared -fPIC -march=x86-64 -mtune=generic codegarden/kakeya/area.cpp -o codegarden/kakeya/.build/area.so
          codegarden/.venv-kakeya/bin/python -B codegarden/kakeya/tests.py > codegarden/artifacts/kakeya/pilot_002/preflight.json
      - name: Check launcher imports without provider calls
        run: codegarden/.venv-kakeya/bin/python -B -c "import runpy; runpy.run_path('codegarden/kakeya/pilot.py',run_name='preflight_import_only')"
      - name: Run bounded structural-versus-coordinate pilot
        id: pilot
        env:
          GH_TOKEN: ${{ github.token }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: codegarden/.venv-kakeya/bin/python -B -u codegarden/kakeya/pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-kakeya-pilot
          retention-days: 30
          path: codegarden/artifacts/kakeya/pilot_002/
      - uses: actions/upload-artifact@v4
        if: steps.pilot.outputs.has_candidate == 'true'
        with:
          name: codegarden-kakeya-candidate
          retention-days: 30
          path: codegarden/artifacts/kakeya/pilot_002/candidate.json
  accept:
    needs: research
    if: needs.research.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch only frozen independent acceptance sources
        run: |
          python3 -B - <<'PY'
          import os,pathlib,urllib.request
          for name in ["verify.py","protected/manifest.json","protected/official.py","protected/independent.py"]:
              p=pathlib.Path("codegarden/kakeya")/name;p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/howdymary/compute-forecasting/"+os.environ["SOURCE_SHA"]+"/codegarden/kakeya/"+name,timeout=30).read())
          PY
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-kakeya-candidate
          path: codegarden/kakeya/.verify-input/
      - name: Exact acceptance without optimizer or provider credentials
        run: |
          python3 -B codegarden/kakeya/verify.py codegarden/kakeya/.verify-input/candidate.json > codegarden/kakeya/isolated_acceptance.json
          python3 -B - <<'PY'
          import json
          r=json.load(open("codegarden/kakeya/isolated_acceptance.json"))
          assert r["accepted"] and r["score"] < 0.10675138995168142-1e-9
          print(json.dumps(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-kakeya-isolated-acceptance
          retention-days: 30
          path: codegarden/kakeya/isolated_acceptance.json
