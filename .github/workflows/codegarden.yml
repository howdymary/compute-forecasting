name: CodeGarden LP-guided neighborhoods
on:
  push:
    branches: [codegarden-lp-003]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-free-lp
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  lp-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated sparse LP and exact solver
        run: |
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install numpy==2.4.6 scipy==1.16.3 ortools==9.14.6206
      - name: Solve fractional guides and independently accept only integer witnesses
        run: codegarden/.venv/bin/python -B -u codegarden/phase3/lp_neighborhoods.py
      - name: Publish exact scopes and dual certificate if available
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B codegarden/phase3/publish_lp.py
      - name: Retain source-backed experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-lp-neighborhoods
          path: codegarden/artifacts/phase3/lp_neighborhoods_001/
