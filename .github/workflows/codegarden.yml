name: CodeGarden recover pending research memory
on:
  push:
    branches: [codegarden-side-memory-recovery-001]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-side-memory-recovery-001
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch minimal isolated recovery source
        run: |
          python3 -B - <<'PY'
          import pathlib,urllib.request,os
          for name in ["codegarden/side_services/cycle.py","codegarden/side_services/recover_memory.py","codegarden/supervisor.py","codegarden/protected/manifest.json","codegarden/protected/verify_descendants.py","codegarden/protected/verify_lcs.py","codegarden/artifacts/side_research/services_001/summary.json"]:
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/howdymary/compute-forecasting/"+os.environ["SOURCE_SHA"]+"/"+name,timeout=30).read())
          PY
      - name: Recover existing handles and reuse method without resubmitting ingestions
        env:
          GH_TOKEN: ${{ github.token }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python3 -B -u codegarden/side_services/recover_memory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-side-memory-recovery
          retention-days: 30
          path: codegarden/artifacts/side_research/memory_recovery_001/
