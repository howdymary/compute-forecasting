name: CodeGarden exact radius probe
on:
  push:
    branches: [codegarden-radius34]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-radius-only
  cancel-in-progress: false
jobs:
  exact-radius:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch immutable isolated source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify boundary and test radius-three/four exchanges
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -B codegarden/supervisor.py codegarden/artifacts/best_code.txt
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase2/radius_sweep.cpp -o codegarden/.build/radius_sweep
          python -B codegarden/phase2/radius_probe.py
