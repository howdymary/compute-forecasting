name: CodeGarden event-driven breakout
on:
  push:
    branches: [codegarden-morris-003]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-free-morris-003
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  CODEGARDEN_BATCH: morris_001
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - name: Compile and independently exhaust small cases
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/morris.cpp -o codegarden/.build/infeasible
          python -B -u codegarden/phase3/test_infeasible.py
          python -B -u codegarden/phase3/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: codegarden-morris-preflight
          path: codegarden/artifacts/phase3/morris_001/
  probes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [990001, 990002, 990003, 990004]
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-morris-preflight
          path: codegarden/artifacts/phase3/morris_001/
      - name: Compile and run bounded component
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/morris.cpp -o codegarden/.build/infeasible
          python -B -u codegarden/phase3/morris_probe.py --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-morris-${{ matrix.seed }}
          path: codegarden/artifacts/phase3/morris_001/
  collect:
    needs: [preflight, probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          pattern: codegarden-morris-*
          merge-multiple: true
          path: codegarden/artifacts/phase3/morris_001/
      - name: Publish leased results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -u codegarden/phase3/publish_morris.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-morris-collected
          path: codegarden/artifacts/phase3/morris_001/
