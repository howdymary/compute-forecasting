name: CodeGarden isolated research
on:
  push:
    branches: [codegarden]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-only
  cancel-in-progress: false
jobs:
  verify-and-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all independent checks and protection
        run: |
          python -B -m unittest discover -s codegarden/tests -v
          python -B codegarden/supervisor.py codegarden/artifacts/best_code.txt
      - name: Install only CodeGarden clients and exact solver
        run: |
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install -r codegarden/requirements-providers.txt -r codegarden/requirements-exact.txt
      - name: Compile and independently test the native incidence kernel
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/kernel.cpp -o codegarden/.build/kernel
          python -B codegarden/test_kernel.py
      - name: Read current account usage before allocated sponsor work
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: codegarden/.venv/bin/python -B codegarden/budget/preflight.py
      - name: Execute bounded actual Exa memory Modal and Tinker research
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: codegarden/.venv/bin/python -B -u codegarden/live_campaign.py
      - name: Collect read-only attributed billing receipts
        if: always()
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: codegarden/.venv/bin/python -B codegarden/ci/cost_receipts.py
      - name: Retain exact client versions and independently check all outputs
        if: always()
        run: |
          codegarden/.venv/bin/python -m pip freeze > codegarden/artifacts/live/environment.txt
          python -B codegarden/ci/final_check.py
      - name: Publish only CodeGarden receipts with a branch lease
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python -B codegarden/ci/publish_results.py
# Normalize Transformers template output and serialize isolated Modal closures.
# Resume only the unfinished live research and policy evaluation; native paired batch is complete.
