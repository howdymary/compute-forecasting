name: CodeGarden supplemental controls
on:
  push:
    branches: [codegarden-policy-control]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-only
  cancel-in-progress: false
env:
  HF_HOME: ${{ github.workspace }}/codegarden/.cache/huggingface
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Fetch immutable preregistered control source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify protected boundary and install isolated clients
        run: |
          python -B codegarden/supervisor.py codegarden/artifacts/best_code.txt
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install -r codegarden/requirements-providers.txt
      - name: Run serialized controls with main-campaign reservations imported
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: codegarden/.venv/bin/python -B -u codegarden/phase2/supplement.py
