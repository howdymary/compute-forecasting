name: CodeGarden infeasible-space hypotheses
on:
  push:
    branches: [codegarden]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-only
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  CODEGARDEN_BATCH: infeasible_probe_001
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile kernel and independently test energy updates
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/infeasible.cpp -o codegarden/.build/infeasible
          python -B codegarden/phase3/test_infeasible.py
          python -B codegarden/phase3/preflight.py
      - name: Retain preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-cg3-preflight
          path: codegarden/artifacts/phase3/infeasible_probe_001/
  probes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [930001, 930002, 930003, 930004]
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-cg3-preflight
          path: codegarden/artifacts/phase3/infeasible_probe_001/
      - name: Compile isolated native worker
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/infeasible.cpp -o codegarden/.build/infeasible
      - name: Test four paired 60-CPU-second hypotheses
        run: python -B -u codegarden/phase3/probe.py --seed ${{ matrix.seed }} --seconds 60
      - name: Retain every checkpoint and proposal, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-cg3-probe-${{ matrix.seed }}
          path: codegarden/artifacts/phase3/infeasible_probe_001/
  collect:
    needs: [preflight, probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: codegarden-cg3-*
          merge-multiple: true
          path: codegarden/artifacts/phase3/infeasible_probe_001/
      - name: Independently accept proposals and publish leased checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -u codegarden/phase3/publish.py
      - name: Retain collected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-cg3-collected
          path: codegarden/artifacts/phase3/infeasible_probe_001/
