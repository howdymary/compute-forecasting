name: CodeGarden feasible-hint CP-SAT LNS controls
on:
  push:
    branches: [codegarden-cp-lns-003]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-free-cp-lns-003
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  CODEGARDEN_BATCH: cp_lns_001
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - name: Check protected verifier and current incumbent
        run: |
          mkdir -p codegarden/.build
          python -B -u codegarden/phase3/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: codegarden-novel-preflight
          path: codegarden/artifacts/phase3/cp_lns_001/
  probes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [0, 1, 2, 3]
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-novel-preflight
          path: codegarden/artifacts/phase3/cp_lns_001/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run endpoint releases and blocker-driven repair pools
        run: |
          mkdir -p codegarden/.build
          python -m venv codegarden/.venv
          codegarden/.venv/bin/pip install -r codegarden/requirements-exact.txt
          g++ -O3 -std=c++17 codegarden/phase3/bundle_connected_v2.cpp -o codegarden/.build/bundle
          codegarden/.venv/bin/python -B -u codegarden/phase3/cp_lns.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-novel-${{ matrix.case }}
          path: codegarden/artifacts/phase3/cp_lns_001/
  collect:
    needs: [preflight, probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          pattern: codegarden-novel-*
          merge-multiple: true
          path: codegarden/artifacts/phase3/cp_lns_001/
      - name: Publish leased results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -u codegarden/phase3/publish_cp_lns.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-novel-collected
          path: codegarden/artifacts/phase3/cp_lns_001/
