name: CodeGarden multi-family Modal repairs
on:
  push:
    branches: [codegarden-modal-003]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-provider-serial
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.sha }}
  HF_HOME: ${{ github.workspace }}/codegarden/.cache/huggingface
  XDG_CACHE_HOME: ${{ github.workspace }}/codegarden/.cache
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  modal-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and independently check native pair-energy updates
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/infeasible.cpp -o codegarden/.build/infeasible
          python -B codegarden/phase3/test_infeasible.py
          python -B codegarden/supervisor.py codegarden/artifacts/best_code.txt
      - name: Install isolated pinned provider SDK
        run: |
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install -r codegarden/requirements-providers.txt
      - name: Run bounded multi-family target search and exact refinements
        env:
          GH_TOKEN: ${{ github.token }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: codegarden/.venv/bin/python -B -u codegarden/phase3/modal_batch.py
      - name: Retain accounting and checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegarden-modal-pair-001
          path: |
            codegarden/artifacts/phase3/modal_pair_001/
            codegarden/artifacts/shared-budget.sqlite
            codegarden/budget/historical-usage.json
