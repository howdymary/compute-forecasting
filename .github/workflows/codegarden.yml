name: CodeGarden memory-only recovery
on:
  push:
    branches: [codegarden-policy-control]
    paths: [.github/workflows/codegarden.yml]
permissions:
  contents: write
concurrency:
  group: codegarden-only
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HOME: ${{ github.workspace }}/codegarden/.cache/huggingface
  XDG_CACHE_HOME: ${{ github.workspace }}/codegarden/.cache
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Fetch immutable recovery source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated clients
        run: |
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install -r codegarden/requirements-providers.txt
      - name: Run bounded memory-only recovery and retain every completed response
        env:
          GH_TOKEN: ${{ github.token }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: codegarden/.venv/bin/python -B -u codegarden/phase2/memory_recovery.py
