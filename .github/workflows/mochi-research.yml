name: Mochi isolated robot research
on:
  push:
    branches: [mochi-hackathon]
    paths: ['mochi/src/mochi/research.py', 'mochi/src/mochi/remote.py', 'mochi/src/mochi/integrations.py', 'mochi/src/mochi/simulation.py', 'mochi/configs/**', '.github/workflows/mochi-research.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mochi-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent Mochi environment
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]'
      - name: Verify simulation contracts
        run: python -m pytest mochi/tests -q
      - name: Run model-driven Exa, past.dev and Modal loop
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -m mochi.research --out mochi/artifacts/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-research-${{ github.run_id }}
          path: mochi/artifacts/
          retention-days: 30
