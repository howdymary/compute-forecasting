name: Evaluate frozen direct forecasts with independent samples v13
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/direct-sampling-v13.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: direct-sampling-v13
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [17, 29, 43]
    steps:
      - name: Fetch registered implementation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original data and exact client lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43952200479 --repo "$GITHUB_REPOSITORY" --name direct-v12-inputs-43952200479 --dir inputs/direct-v12
      - run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r inputs/direct-v12/requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Evaluate frozen weights without a repeated request seed
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -m compute_forecast.direct_sampling_v13 --inputs inputs/direct-v12 --output artifacts/v13/seed-${{ matrix.seed }} --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-v13-seed-${{ matrix.seed }}
          path: artifacts/v13/seed-${{ matrix.seed }}
          retention-days: 30
  publish:
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fetch immutable verification and publication code
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-v13-seed-*
          path: inputs/v13-downloads
      - name: Normalize retained directories
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          for source in Path('inputs/v13-downloads').glob('direct-v13-seed-*'):
              destination=Path('inputs/v13')/source.name.replace('direct-v13-','')
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copytree(source,destination)
          PY
      - name: Verify sampled quantiles and publish separate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python scripts/publish_direct_v13.py
