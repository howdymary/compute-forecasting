name: BoundForge provider preflight
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/boundforge-preflight.yml]
permissions:
  contents: read
concurrency:
  group: boundforge-billing
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source on remote runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only account clients
        run: python -m pip install modal tinker
      - name: Inspect balances without paid operations
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_SERVICE_KEY: ${{ secrets.EXA_SERVICE_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python boundforge/preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundforge-preflight
          path: boundforge/results/
          retention-days: 14
