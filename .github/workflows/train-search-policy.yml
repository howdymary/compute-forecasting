name: Train full six-trial Tinker research policy

on:
  push:
    branches: [compute-observatory]
    paths:
      - .github/workflows/train-search-policy.yml
      - src/compute_forecast/search_policy.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: full-search-policy-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GRID_RUN_ID: '43644639332'
      EXPECTED_GRID_SHA: '736955f311e6a94323df8ad5df6cb2b41d48669d'
    steps:
      - name: Fetch pinned source archive on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate temporal and information-flow contracts
        run: |
          python -m pip install -e '.[dev]' modal numpy
          python -m compileall -q src
          python -m pytest --junitxml=artifacts/search-tests.xml
      - name: Install CPU-only hosted model clients
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tinker tinker-cookbook
      - name: Await and verify the complete registered numerical grid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/grid
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GRID_RUN_ID" > inputs/grid-source-run.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          run=json.loads(Path('inputs/grid-source-run.json').read_text())
          assert run['head_branch']=='compute-observatory' and run['head_sha']==os.environ['EXPECTED_GRID_SHA']
          assert run['name']=='Run representation benchmark on Modal'
          PY
          gh run watch "$GRID_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GRID_RUN_ID" > inputs/grid-source-run.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          run=json.loads(Path('inputs/grid-source-run.json').read_text())
          assert run['conclusion']=='success' and run['head_sha']==os.environ['EXPECTED_GRID_SHA']
          PY
          gh run download "$GRID_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "representation-$EXPECTED_GRID_SHA-$GRID_RUN_ID" --dir inputs/grid
      - name: Train five actual checkpoints and compare equal six-trial searches
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python -m compute_forecast.search_policy --grid inputs/grid/representation-grid.json --expected-source-sha "$EXPECTED_GRID_SHA" --epochs 5
      - name: Retain actual client versions
        if: always()
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/search-client-environment.txt
      - name: Preserve every checkpoint, negative result and real search trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-trial-policy-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
