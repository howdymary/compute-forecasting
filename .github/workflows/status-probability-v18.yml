name: Inspect retained probability training progress v18
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/status-probability-v18.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Read retained progress without training or inference
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.probability_status_v18
      - uses: actions/upload-artifact@v4
        with:
          name: probability-v18-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/probability-v18-status
          retention-days: 30
