name: Check BoundForge sources and certificate
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [boundforge/**, .github/workflows/boundforge-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable project source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r boundforge/requirements.txt
      - name: Validate fresh-run isolation and atomic budgets
        run: |
          python -m compileall -q boundforge
          python -m pytest -q -p no:cacheprovider boundforge/test_core.py
          python boundforge/verify.py boundforge/results/best.json --baseline boundforge/certificates/incumbent.json
          python boundforge/verify_independent.py boundforge/results/best.json boundforge/certificates/incumbent.json
