name: Capture and issue registered prospective panel v4
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [capture,issue]
        default: capture
permissions:
  contents: read
concurrency:
  group: prospective-panel-v4-source
  cancel-in-progress: false
jobs:
  panel:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check finite collection window
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone
          active='2026-11-15'<=datetime.now(timezone.utc).date().isoformat()<='2027-01-20'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('active='+str(active).lower()+'\n')
          PY
      - if: steps.window.outputs.active == 'true'
        run: python -m pip install -e . modal numpy
      - name: Retain an actual independently licensed source vintage
        if: steps.window.outputs.active == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.review_remote_v4 --mode capture
      - name: Issue only on registered origins, before their deadline
        if: steps.window.outputs.active == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          origin=datetime.now(timezone.utc).date().isoformat()
          config=json.load(open('configs/prospective-selector-v4.json'))
          if origin in config['origins']:
              subprocess.run(['python','-m','compute_forecast.review_remote_v4','--mode','issue','--origin',origin],check=True)
          else:print('No registered issuance today; capture only.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prospective-panel-v4-${{ github.run_id }}
          path: artifacts/review-v4-operations/
          if-no-files-found: ignore
          retention-days: 30
