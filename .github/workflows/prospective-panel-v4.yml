name: Capture and issue registered prospective panel v4
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [capture,issue,score]
        default: capture
      origin:
        type: string
        description: Registered origin for manual issue or score
      commitment_sha:
        type: string
        description: Immutable record hash required for score
permissions:
  contents: write
concurrency:
  group: prospective-panel-v4-source
  cancel-in-progress: false
jobs:
  panel:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal numpy
      - name: Capture, issue or score through the locked remote contracts
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          OPERATION: ${{ inputs.operation }}
          REQUESTED_ORIGIN: ${{ inputs.origin }}
          COMMITMENT_SHA: ${{ inputs.commitment_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          today=datetime.now(timezone.utc).date().isoformat()
          if not '2026-11-15'<=today<='2027-01-20':
              print('Outside the registered collection window. No operation.')
              raise SystemExit(0)
          def run(mode,*args):subprocess.run(['python','-m','compute_forecast.review_remote_v4','--mode',mode,*args],check=True)
          if os.environ['EVENT_NAME']=='schedule':
              run('capture')
              config=json.load(open('configs/prospective-selector-v4.json'))
              if today in config['origins']:run('issue','--origin',today)
              else:print('No registered issuance today; capture only.')
          else:
              operation=os.environ.get('OPERATION') or 'capture'
              if operation=='capture':run('capture')
              elif operation=='issue':run('issue','--origin',os.environ['REQUESTED_ORIGIN'])
              else:run('score','--origin',os.environ['REQUESTED_ORIGIN'],'--commitment-sha',os.environ['COMMITMENT_SHA'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prospective-panel-v4-${{ github.run_id }}
          path: artifacts/review-v4-operations/
          if-no-files-found: ignore
          retention-days: 90

      - name: Retain immutable public collection and forecast receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from compute_forecast.review_v4 import publish_append_only
          files={}
          for mode in ('capture','issue','score'):
              path=Path('artifacts/review-v4-operations')/(mode+'.json')
              if path.exists():files['results/review-v4/prospective/'+os.environ['GITHUB_RUN_ID']+'-'+mode+'.json']=path.read_bytes()
          if files:print('V4_PROSPECTIVE_COMMIT:'+publish_append_only(files),flush=True)
          PY
