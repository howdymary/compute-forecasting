name: Mochi physical route calibration
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/planning-calibration.json']
permissions:
  contents: read
concurrency:
  group: mochi-route-calibration
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Physical calibration only, no Tinker training
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -u -m mochi.planning.calibrate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-route-calibration-${{ github.run_id }}
          path: mochi/artifacts/planning/
          retention-days: 30
