name: Train direct probability forecasts v18
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/train-probability-v18.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: probability-v18-campaign
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve the completed audited inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 44006306188 --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status
          gh run download 44006306188 --repo "$GITHUB_REPOSITORY" --name probability-v18-inputs-44006306188 --dir inputs/probability-v18
      - run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r inputs/probability-v18/requirements-lock.txt
          python -m pip install -e . modal --no-deps
      - name: Check private recovery storage before optimization
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: PYTHONPATH=src python scripts/check_probability_backup_v18.py
      - name: Actual custom-gradient API preflight
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.train_probability_v18 --mode preflight --inputs inputs/probability-v18 --output inputs/probability-v18
      - name: Freeze one common untuned probability reference
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.train_probability_v18 --mode base --inputs inputs/probability-v18 --output inputs/probability-v18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probability-v18-campaign-inputs-${{ github.run_id }}
          path: inputs/probability-v18
          retention-days: 30
  pilot:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        objective: [ce, crps]
        rate: [low, high]
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: probability-v18-campaign-inputs-${{ github.run_id }}
          path: inputs/probability-v18
      - run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r inputs/probability-v18/requirements-lock.txt
          python -m pip install -e . modal --no-deps
      - name: Train the matched development pilot
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PROBABILITY_LR: ${{ matrix.rate == 'low' && '0.00002' || '0.0001' }}
        run: python -m compute_forecast.train_probability_v18 --mode train --inputs inputs/probability-v18 --output artifacts/probability-v18-pilot/${{ matrix.objective }}/${{ matrix.rate }} --objective ${{ matrix.objective }} --seed 17 --lr "$PROBABILITY_LR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probability-v18-pilot-${{ matrix.objective }}-${{ matrix.rate }}-${{ github.run_id }}
          path: artifacts/probability-v18-pilot/
          retention-days: 30
  select:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: probability-v18-pilot-*-${{ github.run_id }}
          path: artifacts/probability-v18-pilot
          merge-multiple: true
      - run: python scripts/select_probability_v18.py
      - uses: actions/upload-artifact@v4
        with:
          name: probability-v18-selection-${{ github.run_id }}
          path: artifacts/probability-v18-selection
          retention-days: 30
  train:
    needs: [prepare, select]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        objective: [ce, crps]
        seed: [29, 43]
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: probability-v18-campaign-inputs-${{ github.run_id }}
          path: inputs/probability-v18
      - uses: actions/download-artifact@v4
        with:
          name: probability-v18-selection-${{ github.run_id }}
          path: artifacts/probability-v18-selection
      - run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r inputs/probability-v18/requirements-lock.txt
          python -m pip install -e . modal --no-deps
      - name: Train the remaining matched seeds without repeating the winning pilot
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OBJECTIVE: ${{ matrix.objective }}
          TRAINING_SEED: ${{ matrix.seed }}
        run: |
          PROBABILITY_LR=$(python -c 'import json,os;print(json.load(open("artifacts/probability-v18-selection/learning-rates.json"))["choices"][os.environ["OBJECTIVE"]]["selected"]["learning_rate"])')
          python -m compute_forecast.train_probability_v18 --mode train --inputs inputs/probability-v18 --output "artifacts/probability-v18-final/$OBJECTIVE/$TRAINING_SEED" --objective "$OBJECTIVE" --seed "$TRAINING_SEED" --lr "$PROBABILITY_LR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probability-v18-final-${{ matrix.objective }}-${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/probability-v18-final/
          retention-days: 30
