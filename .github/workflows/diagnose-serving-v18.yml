name: Diagnose public serving routes v18
on:
  push:
    branches: [compute-observatory]
    paths: ['.github/workflows/diagnose-serving-v18.yml','src/compute_forecast/serving_diagnostic_v18.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read current diagnostic source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/compute-observatory" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal 'httpx[http2]==0.28.1'
      - name: Inspect only public volume metadata
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.serving_diagnostic_v18
      - name: Measure each route independently
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,time,urllib.request
          base="https://howdymary--compute-forecast-evidence-v14-web.us-east.modal.run"
          paths=["/health","/api/evidence-future","/api/probability-v18/future","/api/evidence-v14","/api/probability-v18"]*3
          def one(path):
              start=time.monotonic();row={"path":path}
              try:
                  with urllib.request.urlopen(base+path,timeout=15) as r:
                      raw=r.read();value=json.loads(raw)
                      row.update(status=r.status,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),study_id=value.get("study_id"),ui_revision=value.get("ui_revision"))
              except Exception as error:row.update(error_type=type(error).__name__)
              row["elapsed_seconds"]=time.monotonic()-start
              return row
          warmups=[one(path) for path in ("/api/evidence-future","/api/probability-v18/future")]
          time.sleep(16)  # Deliberately expire the registered 15-second shared refresh clock.
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:rows=list(pool.map(one,paths))
          value={"warmups":warmups,"cache_expiry_wait_seconds":16,"requests":rows,"new_optimizer_updates":0,"model_calls":0}
          pathlib.Path("artifacts/probability-v18-serving-diagnostic/http.json").write_text(json.dumps(value,indent=2)+"\n")
          print(json.dumps(value))
          import httpx
          conditions=[]
          for label,h2 in (("pooled_http1",False),("pooled_http2",True),("pooled_http2_repeat",True),("pooled_http1_repeat",False)):
              with httpx.Client(http2=h2,timeout=15,limits=httpx.Limits(max_connections=6,max_keepalive_connections=6),headers={"Accept-Encoding":"identity"}) as client:
                  def pooled(path):
                      start=time.monotonic();row={"path":path}
                      try:
                          response=client.get(base+path);raw=response.content;value=response.json()
                          row.update(status=response.status_code,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),study_id=value.get("study_id"),http_version=response.http_version,request_id=response.headers.get("X-Compute-Request-ID"))
                      except Exception as error:row["error_type"]=type(error).__name__
                      row["elapsed_seconds"]=time.monotonic()-start
                      return row
                  with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(pooled,paths))
                  conditions.append({"condition":label,"requests":results})
          comparison={"fresh_connection_http1":rows,"pooled_conditions":conditions,"new_optimizer_updates":0,"model_calls":0}
          pathlib.Path("artifacts/probability-v18-serving-diagnostic/transports.json").write_text(json.dumps(comparison,indent=2)+"\n")
          print(json.dumps(comparison))
          assert all(row.get("status")==200 for row in warmups+rows),"A public route failed the strict post-expiry probe"
          assert all(row.get("status")==200 for condition in conditions for row in condition["requests"]),"A pooled transport failed the strict probe"
          PY
      - name: Read only public HTTP timing logs
        if: always()
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path("artifacts/probability-v18-serving-diagnostic");root.mkdir(parents=True,exist_ok=True)
          cmd=["modal","app","logs","compute-forecast-evidence-v14","--tail","1000","--timestamps","--show-container-id","--since","15m","--search","forecast_http"]
          try:
              value=subprocess.run(cmd,capture_output=True,text=True,timeout=45)
              rows=[line for line in value.stdout.splitlines() if "forecast_http" in line]
              result={"returncode":value.returncode,"public_http_timings":rows,"error":value.stderr[-1000:] if value.returncode else None}
          except Exception as error:result={"error_type":type(error).__name__}
          (root/"public-http-timings.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probability-v18-serving-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/probability-v18-serving-diagnostic
          retention-days: 30
