name: Audit price-dynamics v8 input contracts
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/price-dynamics-audit-v8.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: price-dynamics-audit-v8
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact remote source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Inspect immutable pack
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.price_dynamics_audit_v8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-dynamics-input-audit-${{ github.run_id }}
          path: artifacts/price-dynamics-v8
          retention-days: 90
