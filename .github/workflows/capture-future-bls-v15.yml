name: Qualify the current original BLS release for future inference v15
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/capture-future-bls-v15.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source qualification code
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the exact original row and publication calendar
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: PYTHONPATH=src python scripts/capture_bls_future_v15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-bls-v15-${{ github.run_id }}
          path: artifacts/evidence-v14-audit
          retention-days: 30
      - name: Publish the future-only vintage receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_evidence_audit_v14.py
