name: Mochi isolated walking checkpoint audit
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/walking-audit-run.json']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Restore frozen training checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mochi_source_run=$(python -c 'import json;print(json.load(open("mochi/configs/walking-audit-run.json"))["source_run"])')
          gh run download "$mochi_source_run" --repo "$GITHUB_REPOSITORY" --dir mochi/.cache/training-source
      - name: Evaluate walking without contact tasks
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -u -m mochi.curriculum.walk_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-isolated-walking-${{ github.run_id }}
          path: mochi/artifacts/walking-audit/
