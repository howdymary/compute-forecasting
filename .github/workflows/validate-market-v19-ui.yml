name: Validate market-state figures v19
on:
  push:
    branches: [compute-observatory]
    paths: ['src/compute_forecast/ui_http_v18.py','src/compute_forecast/market_ui_v19.py','src/compute_forecast/market_web_v19.py','scripts/validate_market_v19_ui.py','.github/workflows/validate-market-state-v19-ui.yml']
  workflow_run:
    workflows: [Deploy matched forecasting evidence study v14]
    types: [completed]
    branches: [compute-observatory]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-state-v19-png-validation
  cancel-in-progress: false
jobs:
  ui:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch latest research source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/compute-observatory" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
          echo "VALIDATION_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[dev]' modal numpy playwright 'httpx[http2]==0.28.1'
          python -m playwright install --with-deps chromium
      - name: Scientific reconstruction and browser syntax
        run: |
          python -m compileall -q src scripts
          python -m pytest --junitxml=artifacts/probability-v18-tests.xml
          python - <<'PY'
          import json,pathlib,subprocess
          from compute_forecast.market_ui_v19 import HTML
          from compute_forecast.verify_market_v19 import verify,verify_progress
          pointer=pathlib.Path("results/market-state-v19/latest.json")
          if not pointer.exists():pointer=pathlib.Path("results/market-state-v19/progress/latest.json")
          p=json.loads(pointer.read_bytes());report=json.loads(pathlib.Path(p["report_path"]).read_bytes())
          (verify_progress if report["study_id"]=="market-state-v19-progress" else verify)(report)
          root=pathlib.Path('artifacts/market-state-v19-ui');root.mkdir(parents=True,exist_ok=True)
          (root/'script.js').write_text(HTML.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check artifacts/market-state-v19-ui/script.js
      - name: Inspect actual desktop and mobile flows without recording
        run: PYTHONPATH=src python scripts/validate_market_v19_ui.py
      - name: Preserve explicit validation outcome
        if: always()
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("artifacts/market-state-v19-ui");root.mkdir(parents=True,exist_ok=True)
          if not (root/"validation.json").exists():(root/"validation-failure.json").write_text(json.dumps({"status":"failed","job_status":os.environ["VALIDATION_JOB_STATUS"],"run_id":os.environ["GITHUB_RUN_ID"],"video_recorded":False})+"\\n")
          PY
      - name: Publish immutable PNG validation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/market-state-v19-ui
          V18_PUBLIC_KIND: validation
        run: python scripts/publish_market_v19.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-state-v19-ui-${{ github.run_id }}
          path: artifacts/market-state-v19-ui
          retention-days: 30
