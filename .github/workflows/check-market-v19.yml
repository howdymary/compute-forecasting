name: Validate market-state contracts and pending interface v19
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/check-market-v19.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch registered code
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src scripts
          python -m pytest tests/test_market_state_v19.py tests/test_market_future_v19.py tests/test_market_scoring_v19.py tests/test_market_analysis_v19.py --junitxml=artifacts/market-state-v19-contracts/tests.xml
          python - <<'PY'
          from pathlib import Path
          from compute_forecast.market_ui_v19 import HTML
          root=Path('artifacts/market-state-v19-contracts');root.mkdir(parents=True,exist_ok=True)
          (root/'ui.js').write_text(HTML.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check artifacts/market-state-v19-contracts/ui.js
      - name: Publish contract validation
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/market-state-v19-contracts
          V18_PUBLIC_KIND: contracts
        run: python scripts/publish_market_v19.py
