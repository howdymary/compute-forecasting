name: Run registered six-arm price-dynamics study
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/price-dynamics-v8.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-dynamics-v8
  cancel-in-progress: false
jobs:
  experiment:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact registered source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify scientific contracts and frozen artifacts
        run: |
          python -m pip install -e '.[dev]' modal==1.6.4 duckdb==1.2.2
          python -m compileall -q src
          python -m pytest tests/test_price_dynamics_v8.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from compute_forecast.freeze_contract import validate_freeze
          assert hashlib.sha256(Path('results/frozen-v1/forecasts.csv').read_bytes()).hexdigest()=='67a043255a716db6bc9b73cd28f9258c30fb299fd8671a9ee3430c0d94cadd80'
          validate_freeze(json.loads(Path('configs/release-freeze.json').read_bytes()))
          PY
      - name: Execute registered methods and verify with official scorer
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.price_dynamics_remote_v8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-dynamics-v8-${{ github.run_id }}
          path: artifacts/price-dynamics-v8
          retention-days: 90
      - name: Publish immutable measured artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from compute_forecast.publication_v8 import publish
          root=Path('artifacts/price-dynamics-v8')
          files={'results/price-dynamics-v8/runs/'+os.environ['GITHUB_RUN_ID']+'/'+str(p.relative_to(root)):p.read_bytes() for p in root.rglob('*') if p.is_file()}
          print('V8_PUBLICATION_COMMIT:'+publish(files),flush=True)
          PY
