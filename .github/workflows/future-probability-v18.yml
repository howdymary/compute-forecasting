name: Register frozen probability transfer panel v18
on:
  push:
    branches: [compute-observatory]
    paths: ['.github/workflows/future-probability-v18.yml','scripts/retain_probability_v18.py','src/compute_forecast/probability_future_v18.py','src/compute_forecast/probability_future_remote_v18.py']
  workflow_run:
    workflows: [Publish direct probability forecasts v18]
    types: [completed]
    branches: [compute-observatory]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probability-v18-future-activation
  cancel-in-progress: false
jobs:
  register:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch fresh source and retained results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/compute-observatory" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' modal tinker==0.39.1
      - name: Validate maturity and immutable commitment contracts
        run: python -m pytest tests/test_probability_future_v18.py tests/test_probability_v18.py -q
      - name: Resolve selected identities and extend only their retention
        id: lock
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: PYTHONPATH=src python scripts/retain_probability_v18.py
      - name: Verify selected models with an explicitly synthetic read-only probe
        if: steps.lock.outputs.ready == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal run -m compute_forecast.probability_future_remote_v18 --probe
          cp artifacts/probability-v18-future/model-readiness.json artifacts/probability-v18-future-lock/
      - name: Deploy the separately registered finite weekly panel
        if: steps.lock.outputs.ready == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy -m compute_forecast.probability_future_remote_v18
      - name: Publish current readiness without premature forecasts
        if: steps.lock.outputs.ready == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal run -m compute_forecast.probability_future_remote_v18
          cp artifacts/probability-v18-future/readiness.json artifacts/probability-v18-future-lock/
      - name: Publish model lock and accurate pending status
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/probability-v18-future-lock
          V18_PUBLIC_KIND: future
        run: python scripts/publish_probability_v18.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probability-v18-future-${{ github.run_id }}
          path: artifacts/probability-v18-future-lock
          retention-days: 30
