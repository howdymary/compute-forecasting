name: Prepare measured release freeze

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Fetch immutable source on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all causal and release boundaries
        run: |
          python -m pip install -e '.[dev]' modal numpy
          python -m compileall -q src
          python -m pytest --junitxml=artifacts/freeze-tests.xml
      - name: Await measured development results and retrieve exact source evidence
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_RUN_ID: '43648086958'
          BASELINE_RUN_ID: '43646617180'
        run: |
          python - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path('inputs');root.mkdir(exist_ok=True)
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          for kind,run_id,prefix in [('policy',os.environ['POLICY_RUN_ID'],'six-trial-policy'),('baseline',os.environ['BASELINE_RUN_ID'],'official-baseline-selection')]:
              subprocess.run(['gh','run','watch',run_id,'--repo',repo,'--exit-status','--interval','30'],check=True)
              run=api('repos/'+repo+'/actions/runs/'+run_id)
              assert run['conclusion']=='success' and run['head_branch']=='compute-observatory'
              (root/(kind+'-run.json')).write_text(json.dumps(run,indent=2))
              artifact=prefix+'-'+run['head_sha']+'-'+run_id
              subprocess.run(['gh','run','download',run_id,'--repo',repo,'--name',artifact,'--dir',str(root/kind)],check=True)
              if kind=='policy':
                  source=api('repos/'+repo+'/contents/src/compute_forecast/search_policy.py?ref='+run['head_sha'])
                  assert source['encoding']=='base64'
                  (root/'trained-policy-source.py').write_bytes(base64.b64decode(source['content']))
          PY
      - name: Generate a reviewable selection without opening final data
        run: python -m compute_forecast.create_release_freeze
      - name: Preserve the exact freeze for review and commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-freeze-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
