name: Audit current price and BLS sources for signals study
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/source-audit-v6.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m compute_forecast.source_audit_v6
      - uses: actions/upload-artifact@v4
        with:
          name: signals-source-audit-v6-${{ github.run_id }}
          path: artifacts/signals-source-audit-v6/
          retention-days: 90
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from compute_forecast.publication_v6 import publish
          p=Path('artifacts/signals-source-audit-v6/audit.json')
          print(publish({'results/signals-v6/runs/'+os.environ['GITHUB_RUN_ID']+'/'+p.name:p.read_bytes()}))
          PY
