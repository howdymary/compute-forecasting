name: Publish verified public research snapshot
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/publish-public-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compute-forecast-public-snapshot
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch immutable publication source
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publication transport on the remote runner
        run: python -m pip install -e . 'httpx[http2]==0.28.1'
      - name: Publish only validated public outputs
        run: python -m compute_forecast.public_results publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-snapshot-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
