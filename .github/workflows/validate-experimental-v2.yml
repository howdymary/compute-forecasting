name: Validate experimental research UI
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/validate-experimental-v2.yml, src/compute_forecast/validate_experimental_v2.py]
  workflow_run:
    workflows: ["Deploy pricing observatory"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/compute-observatory') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'compute-observatory')
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    timeout-minutes: 25
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install remote browser tools and check new script
        run: |
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          from compute_forecast.experimental_ui_v2 import HTML
          Path('artifacts/experimental-ui.js').write_text(HTML.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check artifacts/experimental-ui.js
      - name: Await this source deployment when the push also updates the product
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['SOURCE_SHA']
          runs=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/workflows/deploy-pricing.yml/runs?branch=compute-observatory&per_page=50'],text=True))['workflow_runs']
          matching=[r for r in runs if r['head_sha']==sha]
          if matching:
              deployment=max(matching,key=lambda r:r['id'])
              subprocess.run(['gh','run','watch',str(deployment['id']),'--repo',repo,'--exit-status','--interval','10'],check=True)
              print('Validated deployment source '+sha,flush=True)
          else:
              print('Validation-only source update; testing the existing deployed product',flush=True)
          PY
      - name: Verify desktop and mobile without recording
        run: python -m compute_forecast.validate_experimental_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-v2-ui-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
