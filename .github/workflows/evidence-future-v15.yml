# Reused scheduled containers explicitly reload the collector volume before each audit or issuance.
# Final pre-issuance source audit includes complete matched controls and poisoning/maturity tests.
# Verify exact original source-ID encoding; inference uses pinned renderer/client versions and CPU utilities.
name: Deploy and audit the frozen paired prospective runner v15
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/evidence-future-v15.yml]
  workflow_run:
    workflows: [Qualify the current original BLS release for future inference v15]
    types: [completed]
    branches: [compute-observatory]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evidence-future-v15-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch current source without a local checkout
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/compute-observatory" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
          echo "GITHUB_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate future contracts and build immutable source inputs
        run: |
          python -m pip install -e '.[dev]' modal==1.6.4 numpy
          python -m compileall -q src scripts
          python -m pytest
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=json.loads(Path('results/evidence-v14/latest.json').read_text())
          raw=Path(p['report_path']).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==p['report_sha256']
          root=Path('inputs/evidence-future-v15');root.mkdir(parents=True,exist_ok=True)
          for name in ('bls-vintages.json','model-lock.json'):
              (root/name).write_bytes((Path(p['report_path']).parent/name).read_bytes())
          vintages=json.loads((root/'bls-vintages.json').read_text())
          present={r['reference_period']:r for r in vintages['records']}
          for source in sorted(Path('results/evidence-v14/audits').glob('*/future-bls-vintage.json')):
              qualified=json.loads(source.read_text())
              assert qualified['study_id']=='direct-evidence-v14-prospective' and qualified['ready']
              for row in qualified['records']:
                  assert row['independent_pdf_check_completed'] and row['status']=='qualified_pending_spot_check'
                  if row['reference_period'] in present:
                      assert present[row['reference_period']]['values']==row['values'],'Original release row changed'
                  else:present[row['reference_period']]=row
          vintages['records']=list(present.values());vintages['future_only_supplement']=True
          (root/'bls-vintages.json').write_text(json.dumps(vintages,indent=2))
          PY
      - name: Store only the existing Tinker inference credential
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python - <<'PY'
          import modal,os
          modal.Secret.objects.create('compute-forecast-evidence-future-v15',{'TINKER_API_KEY':os.environ['TINKER_API_KEY']},allow_existing=True)
          PY
      - name: Deploy bounded inference and audit source readiness
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal deploy -m compute_forecast.evidence_future_remote_v15
          PYTHONPATH=src python -m compute_forecast.evidence_future_remote_v15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-future-v15-${{ github.run_id }}
          path: artifacts/evidence-v14-audit
          retention-days: 30
      - name: Publish readiness and the model-lock hashes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_evidence_audit_v14.py
