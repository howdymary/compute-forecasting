name: Mochi date-scoped Tinker checkpoint cleanup
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/checkpoint-cleanup.json']
permissions:
  contents: read
concurrency:
  group: tinker-date-scoped-cleanup
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install tinker==0.39.1
      - name: Execute exact date scope without creating training sessions
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -u -m mochi.maintenance.checkpoints_by_date
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-checkpoint-date-cleanup-${{ github.run_id }}
          path: mochi/artifacts/maintenance/checkpoint-date-cleanup.json
          retention-days: 30
