name: Inspect direct forecaster checkpoint status v12
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/status-direct-v12.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tinker
      - name: Inspect existing study runs without new sampling or training
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python scripts/inspect_direct_v12.py
      - uses: actions/upload-artifact@v4
        with:
          name: direct-v12-status-${{ github.run_id }}
          path: artifacts/direct-v12-status
          retention-days: 30
