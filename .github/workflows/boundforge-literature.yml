name: BoundForge comparative literature research
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/boundforge-literature.yml]
permissions:
  contents: read
concurrency:
  group: boundforge-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install modal
      - name: Bounded source discovery after balance checks
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -u boundforge/research_v2/discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundforge-comparative-literature
          path: |
            boundforge/research_v2/evidence/discovery.json
            boundforge/research_v2/evidence/budget-snapshot.json
            boundforge/research_v2/evidence/usage.json
          retention-days: 30
