name: Audit direct GPU forecaster data v12
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/audit-direct-v12.yml, configs/direct-forecast-v12.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: direct-v12-preparation
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch immutable source on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - name: Remove superseded audit with an ineligible marketplace derivative
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api -i -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/43951206032" 2>&1) || {
            case "$status" in *"404"*) true ;; *) printf '%s\n' "$status"; exit 1 ;; esac
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install remote clients
        run: python -m pip install -e '.[dev]' modal 'numpy==2.2.6' 'pandas==2.3.1' 'duckdb==1.2.2' 'pyarrow>=16,<24' gdown
      - name: Download and verify unchanged pack on hosted runner
        env:
          DIRECT_V12_DATA_ROOT: ${{ runner.temp }}/direct-v12-data
        run: |
          python - <<'PY'
          import gdown,hashlib,os,pathlib,zipfile
          from compute_forecast.starter_probe import PACK_ID,PACK_SHA256,PACK_NAME,verify_manifest
          base=pathlib.Path(os.environ['DIRECT_V12_DATA_ROOT'])/'pacific';base.mkdir(parents=True,exist_ok=True)
          archive=base/'pack.zip';gdown.download(id=PACK_ID,output=str(archive),quiet=True)
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==PACK_SHA256
          with zipfile.ZipFile(archive) as z:
              for m in z.infolist():
                  p=pathlib.PurePosixPath(m.filename)
                  assert not p.is_absolute() and '..' not in p.parts and (m.external_attr>>16)&0o170000!=0o120000
              z.extractall(base)
          manifests=list(base.rglob('MANIFEST.sha256'));assert len(manifests)==1
          root=manifests[0].parent
          if root!=base/PACK_NAME:root.rename(base/PACK_NAME)
          assert verify_manifest(base/PACK_NAME)==672
          PY
      - name: Prepare exact targets and matured training windows remotely
        env:
          DIRECT_V12_DATA_ROOT: ${{ runner.temp }}/direct-v12-data
        run: python -c 'from compute_forecast.direct_data_v12 import hosted; hosted()'
      - name: Save data audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-v12-audit-${{ github.run_id }}
          path: artifacts/direct-v12
          retention-days: 30
