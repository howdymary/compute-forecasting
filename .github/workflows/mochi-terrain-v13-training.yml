name: Mochi fresh-state walking and task post-training
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/terrain-v13-training-launch.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: mochi-terrain-v13-resource-budget
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
      MOCHI_PARENT_SOURCE: ${{ github.workspace }}/mochi/.cache/v13-parent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore completed parent evidence and private optimizer references
        env:
          GH_TOKEN: ${{ github.token }}
        run: python mochi/scripts/fetch_terrain_parent.py
      - name: Install isolated pinned runtime
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,robotics,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Check continuation and preserved controller contracts
        run: python -m pytest -q mochi/tests/test_terrain_v13.py mochi/tests/test_terrain_v12.py mochi/tests/test_balanced_v11.py mochi/tests/test_control_v8.py mochi/tests/test_richdesk.py
      - name: Recall, search, collect physical labels, post-train and evaluate
        timeout-minutes: 335
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.terrain_v13.train
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-terrain-v13-training-${{ github.run_id }}
          path: mochi/artifacts/terrain-v13-training/
          retention-days: 30
  publish:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: mochi-curriculum-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: mochi-terrain-v13-training-${{ github.run_id }}
          path: mochi/.cache/v13-completed
      - name: Export completed physical recordings without private checkpoint paths
        run: |
          python mochi/scripts/assess_terrain_v13.py --source mochi/.cache/v13-completed
          python mochi/scripts/build_terrain_v13_preview.py --source mochi/.cache/v13-completed
          node mochi/scripts/check_terrain_training_ui.mjs --v13
          node mochi/scripts/check_terrain_training_ui.mjs
      - run: python -m pip install modal==1.6.4
      - name: Add the new checkpoint comparison alongside preserved demonstrations
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m modal deploy --strategy recreate mochi/scripts/deploy_curriculum.py
      - name: Verify the completed deployed manifest
        run: |
          python - <<'PYCODE'
          import json,os,urllib.request
          base='https://howdymary--mochi-curriculum-demo-web.us-east.modal.run'
          manifest=json.load(urllib.request.urlopen(base+'/terrain-v13-training/manifest.json',timeout=30))
          assert manifest['evaluation_status']=='completed'
          assert manifest['workflow_run']=='mochi-t13-'+os.environ['GITHUB_RUN_ID']
          assert manifest['test_pairs_available']==4
          assert set(manifest['held_out'])=={'parent','selected','fixed','static'}
          print('Verified',manifest['optimizer_updates_completed'],'actual optimizer updates and',len(manifest['recordings']),'recorded rollouts')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-terrain-v13-public-demo-${{ github.run_id }}
          path: |
            mochi/web/desk/terrain-v13-trained.html
            mochi/web/desk/terrain-v13-trained.js
            mochi/web/desk/terrain-v13-training/
            mochi/.cache/v13-completed/assessment.json
            mochi/.cache/v13-completed/assessment.md
          retention-days: 30
