name: Verify past.dev setup and retained error diagnostics
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/check-past-setup-v5.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Isolate audience and actor length validation
        env:
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -m compute_forecast.check_past_setup_v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: past-setup-v5-${{ github.run_id }}
          path: artifacts/past-setup-v5/
          retention-days: 90
      - name: Publish sanitized setup receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from compute_forecast.publication_v5 import publish
          p=Path('artifacts/past-setup-v5/setup-diagnostic.json')
          print(publish({'results/value-v5/runs/'+os.environ['GITHUB_RUN_ID']+'/'+p.name:p.read_bytes()}),flush=True)
          PY
