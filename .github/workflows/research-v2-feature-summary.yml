name: Publish verified feature imputation summary
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-feature-summary.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and publish the corrected audit revision
        run: |
          python -m pip install -e . modal numpy
          gh run watch 43669085854 --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run download 43669085854 --repo "$GITHUB_REPOSITORY" --name campaign-v2-feature-audit-43669085854 --dir inputs/features
          modal run -m compute_forecast.feature_summary_v2 --inputs inputs/features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-feature-summary-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
