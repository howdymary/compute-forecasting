name: Check BoundForge research v2
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [boundforge/research_v2/**, .github/workflows/boundforge-v2-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r boundforge/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider boundforge/research_v2/test_v2.py
