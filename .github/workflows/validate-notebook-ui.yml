name: Validate interactive notebook without recording
on:
  workflow_run:
    workflows: ["Deploy pricing observatory"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/compute-observatory') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'compute-observatory')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Fetch exact deployed source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools on remote runner
        run: |
          python -m pip install -e . playwright 'httpx[http2]==0.28.1'
          python -m playwright install --with-deps chromium
      - name: Verify notebook data, interactions and responsive visuals
        run: python -m compute_forecast.validate_notebook_ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-ui-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
