name: Mochi geometry and force-margin post-training
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/refinement-protocol.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: mochi-curriculum-v6
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned simulation and service runtime
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Restore actual physical training evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mochi_source_run=$(python -c 'import json;print(json.load(open("mochi/configs/refinement-protocol.json"))["source_dataset_run"])')
          gh run download "$mochi_source_run" --repo "$GITHUB_REPOSITORY" --dir mochi/.cache/refine-source
      - name: Publish credential-free numerical monitor
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m modal deploy -m mochi.curriculum.refine_monitor
      - name: Post-train walking and all four task-control decisions
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.curriculum.refine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-refinement-${{ github.run_id }}
          path: mochi/artifacts/refinement-v7/
          retention-days: 30
