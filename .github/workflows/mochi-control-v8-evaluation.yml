name: Mochi held-out task and recovery probes
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/control-v8-evaluation.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: mochi-source-control-probes
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned runtime and assets
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Retrieve retained state references and numerical report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mochi_training_run=$(python -c 'import json;print(json.load(open("mochi/configs/control-v8-evaluation.json"))["source_training_run"])')
          gh run download "$mochi_training_run" --repo "$GITHUB_REPOSITORY" --dir mochi/.cache/control-source
      - name: Evaluate actual before and selected model choices
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -u -m mochi.control_v8.isolated_run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-control-v8-isolated-${{ github.run_id }}
          path: mochi/artifacts/control-v8-isolated/
          retention-days: 30
