name: Inspect durable training progress v19
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/status-market-v19.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/compute-observatory" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Read durable counters without inference or optimization
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.market_progress_v19
      - name: Publish actual progress
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/market-state-v19-status
          V18_PUBLIC_KIND: status
        run: python scripts/publish_market_v19.py
