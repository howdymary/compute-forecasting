name: Validate research explorer without recording
on:
  workflow_run:
    workflows: ["Deploy pricing observatory"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/compute-observatory') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'compute-observatory')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Fetch exact deployed source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools on remote runner
        run: |
          python -m pip install -e . playwright modal
          python -m playwright install --with-deps chromium
      - name: Download immutable paired trace artifacts for publication concurrency check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43665821333 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-*' --dir inputs
      - name: Verify historical context, matched research and responsive interactions
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          VALIDATE_PUBLICATION: '1'
        run: python -m compute_forecast.validate_research_explorer_v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-explorer-ui-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
