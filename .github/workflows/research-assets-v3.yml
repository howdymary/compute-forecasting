name: Publish licensed context and saved research traces
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-assets-v3.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: compute-forecast-research-assets-v3
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Fetch immutable source remotely
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Download real completed SFT artifacts
        run: gh run download 43665821333 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-*' --dir inputs
      - name: Publish independent licensed history and sanitized paired traces atomically
        run: modal run -m compute_forecast.research_assets_v3 --inputs inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-assets-v3-${{ github.run_id }}
          path: artifacts/
