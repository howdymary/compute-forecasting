name: Validate historical forecast timeline without recording
on:
  workflow_run:
    workflows: ["Deploy pricing observatory"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/compute-observatory') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'compute-observatory')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Fetch exact deployed source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools on remote runner
        run: |
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Validate exact history, forecasts, interaction and layouts
        run: python -m compute_forecast.validate_timeline_v7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeline-v7-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: artifacts/timeline-v7/
          retention-days: 90
