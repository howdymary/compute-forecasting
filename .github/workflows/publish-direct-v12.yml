name: Publish direct GPU forecasting research v12
on:
  workflow_run:
    workflows: [Train direct GPU price forecasts v12, Recover direct forecasting evaluations v12, Finalize retained direct forecasts v12, Complete direct forecast seed43 v12]
    types: [completed]
    branches: [compute-observatory]
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/publish-direct-v12.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: direct-v12-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      PUBLICATION_ID: ${{ github.event.workflow_run.id || '43952200479' }}-publication-${{ github.run_id }}
    timeout-minutes: 25
    steps:
      - name: Fetch publication source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve completed registered training run
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          TRAINING_RUN_ID: '43952200479'
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '43952200479' }}
          PUBLICATION_ID: ${{ github.event.workflow_run.id || '43952200479' }}-publication-${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['SOURCE_RUN_ID']],text=True))
          assert r['head_branch']=='compute-observatory' and r['name'] in ('Train direct GPU price forecasts v12','Recover direct forecasting evaluations v12','Finalize retained direct forecasts v12','Complete direct forecast seed43 v12')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+str(r['status']=='completed').lower()+'\n')
          PY
      - name: Retrieve immutable inputs and retained successful or failed outputs
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRAINING_RUN_ID: '43952200479'
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '43952200479' }}
        run: |
          gh run download "$TRAINING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "direct-v12-inputs-$TRAINING_RUN_ID" --dir inputs/publication/input
          if [ "$SOURCE_RUN_ID" = "$TRAINING_RUN_ID" ]; then
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "direct-v12-seed-*" --dir inputs/publication/runs
          else
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "direct-v12-recovered-seed-*" --dir inputs/publication/runs
          fi
      - name: Reconstruct and verify every published numerical claim
        if: steps.ready.outputs.ready == 'true'
        env:
          TRAINING_RUN_ID: '43952200479'
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '43952200479' }}
        run: |
          python scripts/merge_published_direct_v12.py
          PYTHONPATH=src python scripts/assemble_direct_v12.py --inputs inputs/publication --output artifacts/direct-v12-public
          PYTHONPATH=src python -m compute_forecast.verify_direct_v12 --results artifacts/direct-v12-public
      - name: Publish versioned research without force updates
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRAINING_RUN_ID: '43952200479'
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '43952200479' }}
        run: PYTHONPATH=src python scripts/publish_direct_v12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-v12-publication-${{ github.run_id }}
          path: artifacts/direct-v12-public
          retention-days: 30
