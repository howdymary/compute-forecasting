name: BoundForge research-led structural pilot
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/boundforge-structural-v2.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: boundforge-research
  cancel-in-progress: false
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: python -m pip install -r boundforge/requirements.txt modal tinker transformers
      - name: Check numerical derivatives, bounded programs and verifiers
        run: |
          python -m compileall -q boundforge/research_v2
          python -m pytest -q -p no:cacheprovider boundforge/research_v2/test_v2.py
          python boundforge/verify.py boundforge/results/best.json
      - name: Run research-led pilot after completed review
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -u boundforge/research_v2/campaign.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundforge-structural-v2
          path: boundforge/research_v2/output/
          retention-days: 30
  independent-check:
    needs: campaign
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch exact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: boundforge-structural-v2
          path: boundforge/research_v2/recheck
      - run: python -m pip install python-flint==0.8.0
      - name: Independently recheck the retained witness
        run: |
          python boundforge/verify.py boundforge/research_v2/recheck/best.json --baseline boundforge/results/best.json
          python boundforge/verify_independent.py boundforge/research_v2/recheck/best.json boundforge/results/best.json
