name: Train categorical CE continuation v21
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/train-ce-continuation-v21.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ce-continuation-v21-campaign
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      arms: ${{ steps.gate.outputs.arms }}
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse completed optimizer verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 44135344681 --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status
          gh run download 44135344681 --repo "$GITHUB_REPOSITORY" --name ce-continuation-v21-preflight-44135344681 --dir artifacts/ce-continuation-v21-preflight
      - name: Enforce frozen readiness before training
        id: gate
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          def digest(x):return hashlib.sha256(json.dumps(x,sort_keys=True,allow_nan=False,separators=(',',':')).encode()).hexdigest()
          p=json.loads(pathlib.Path('configs/ce-continuation-v21.json').read_bytes())
          r=json.loads(pathlib.Path('artifacts/ce-continuation-v21-preflight/readiness.json').read_bytes())
          bind=json.loads(pathlib.Path('configs/ce-continuation-v21-inputs.json').read_bytes())
          assert r['protocol_sha256']==digest(p) and r['dataset_sha256']==bind['dataset_sha256']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+str(r['training_ready']).lower()+'\narms='+json.dumps(r['arms'],separators=(',',':'))+'\n')
          print(json.dumps({'training_ready':r['training_ready'],'arms':r['arms'],'reasons':r['reasons']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ce-continuation-v21-preflight-${{ github.run_id }}
          path: artifacts/ce-continuation-v21-preflight
          retention-days: 90
  train:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 220
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: ${{ fromJSON(needs.prepare.outputs.arms) }}
    steps:
      - name: Fetch immutable experiment source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse frozen supported training dependencies
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/market-state-v19.txt
          python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: ce-continuation-v21-preflight-${{ github.run_id }}
          path: artifacts/ce-continuation-v21-preflight
      - name: Load exactly the registered matched corpus
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python scripts/load_continuation_inputs_v21.py
      - name: Continue the saved categorical model
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m compute_forecast.train_continuation_v21 --arm ${{ matrix.arm }} --seed 17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ce-continuation-v21-model-${{ matrix.arm }}-17-${{ github.run_id }}
          path: artifacts/ce-continuation-v21-models
          retention-days: 90
  publish:
    needs: [prepare, train]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch the exact registered analysis
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: ce-continuation-v21-preflight-${{ github.run_id }}
          path: artifacts/ce-continuation-v21-preflight
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.ready == 'true'
        with:
          pattern: ce-continuation-v21-model-*-${{ github.run_id }}
          merge-multiple: true
          path: artifacts/ce-continuation-v21-models
      - name: Reconstruct actual forecasts and selections
        run: python scripts/assemble_continuation_v21.py
      - name: Publish complete or gated outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          V21_PUBLIC_ROOT: artifacts/ce-continuation-v21-public
          V21_PUBLIC_KIND: runs
        run: python scripts/publish_continuation_v21.py
