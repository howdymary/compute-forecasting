name: Observe saved v2 training progress without model calls
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-progress.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-readonly-training-progress
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only progress client
        run: python -m pip install -e . modal
      - name: Publish saved counts until reward workflow ends
        run: |
          python - <<'PY'
          import json,os,subprocess,time
          for _ in range(360):
              subprocess.run(['modal','run','-m','compute_forecast.progress_v2'],check=True)
              r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/43677499284'],text=True))
              if r['status']=='completed':break
              time.sleep(45)
          PY
