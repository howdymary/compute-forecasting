name: Mochi safe laptop stance and unchanged trained checkpoints
on:
  push:
    branches: [mochi-desk-v3]
    paths: ['mochi/configs/clearance-launch.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: mochi-clearance-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    env:
      PYTHONPATH: ${{ github.workspace }}/mochi/src
      MOCHI_ROOT: ${{ github.workspace }}/mochi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned runtime and robot assets
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './mochi[remote,dev]' pyyaml==6.0.2
          python mochi/scripts/fetch_visual_models.py
      - name: Restore completed training evidence and immutable state references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mochi_source_run=$(python -c 'import json;print(json.load(open("mochi/configs/clearance-protocol.json"))["source_training_run"])')
          gh run download "$mochi_source_run" --repo "$GITHUB_REPOSITORY" --dir mochi/.cache/clearance-source
      - name: Evaluate unchanged trained checkpoints and fresh paired cases
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -u -m mochi.control_v8.clearance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochi-clearance-${{ github.run_id }}
          path: mochi/artifacts/control-clearance/
          retention-days: 30
