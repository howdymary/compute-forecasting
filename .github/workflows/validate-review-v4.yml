name: Validate review findings without recording
on:
  workflow_run:
    workflows: ["Deploy pricing observatory"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [src/compute_forecast/validate_review_v4.py, .github/workflows/validate-review-v4.yml]
permissions:
  contents: read
jobs:
  validate:
    if: (github.event_name != 'workflow_run' && github.ref == 'refs/heads/compute-observatory') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'compute-observatory')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Fetch exact deployed source on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install remote browser
        run: |
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Check source values and notebook interactions
        run: python -m compute_forecast.validate_review_v4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-ui-v4-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: artifacts/review-ui-v4/
          retention-days: 30
