name: BoundForge entropy-constrained follow-up
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/boundforge-nondegenerate.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: boundforge-research
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r boundforge/requirements.txt modal
      - uses: actions/download-artifact@v4
        with:
          name: boundforge-structural-v2
          run-id: '43675810337'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: boundforge/research_v2/previous
      - name: Run registered paired optimizer diagnostic
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -u boundforge/research_v2/followup.py
      - name: Run second checker again
        run: python boundforge/verify_independent.py boundforge/research_v2/followup/best.json boundforge/results/best.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundforge-nondegenerate
          path: boundforge/research_v2/followup/
          retention-days: 30
