# Refresh completed-report publication after seed 29; no training jobs are rerun.
name: Publish completed canonical policy reports during campaign
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-publish-completed.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-publish-completed-reports
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CAMPAIGN_STATUS: running
      CAMPAIGN_RUN_ID: '43677499284'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check finalizer has not completed
        id: phase
        run: |
          python - <<'PY'
          import json,os,subprocess
          r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/43677709126'],text=True))
          active=r['status']!='completed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('active='+str(active).lower()+'\n')
          print('Finalizer status:',r['status'],r['conclusion'])
          PY
      - name: Collect only completed canonical run artifacts
        if: steps.phase.outputs.active == 'true'
        run: |
          gh run download 43665821333 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-*' --dir inputs/campaign
          gh run download 43677499284 --repo "$GITHUB_REPOSITORY" --pattern 'campaign-v2-rl-*' --dir inputs/rl
          gh run download 43665112830 --repo "$GITHUB_REPOSITORY" --name campaign-v2-evidence-bd267f17fa31106a05a22e3b6b4739f7bd6c0327-43665112830 --dir inputs/evidence
          python - <<'PY'
          import json
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in Path('inputs').rglob('policy-report.json')]
          sft=[p for p in reports if p['mode']=='sft'];rl=[p for p in reports if p['mode']=='rl']
          assert len(sft)==6 and {(p['seed'],p['objective']) for p in sft}=={(s,o) for s in (17,29,43) for o in ('hard','soft')}
          assert 1<=len(rl)<=3 and len({p['seed'] for p in rl})==len(rl)
          assert {p['seed'] for p in rl}<={17,29,43}
          assert all(p['code_sha']=='f77491274342436078224d9b862780cfeb576ef0' for p in rl)
          assert all(not p['future_competition_truth_loaded'] and not p['v1_final_used'] for p in reports)
          assert all(p['selected_update'] in {c['update'] for c in p['checkpoints']} for p in reports)
          print('V2_INCREMENTAL_COUNTS:'+json.dumps({'sft':6,'rl':len(rl),'rl_updates':sum(p['actual_optimizer_updates'] for p in rl),'campaign_complete':False}))
          PY
      - name: Publish completed reports without new model calls
        if: steps.phase.outputs.active == 'true'
        run: |
          python -m pip install -e '.[dev]' modal playwright
          modal run -m compute_forecast.experimental_v2 --inputs inputs
      - name: Verify actual results and responsive interactions
        if: steps.phase.outputs.active == 'true'
        run: |
          python -m playwright install --with-deps chromium
          python -m compute_forecast.validate_experimental_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-completed-reports-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
