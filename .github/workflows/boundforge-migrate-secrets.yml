name: Transfer BoundForge encrypted credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyNaCl
      - name: Seal only required keys for destination repository
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PYKEY'
          import os,base64,json
          from nacl.public import PublicKey,SealedBox
          key=PublicKey(base64.b64decode('KRSQ2EYoRAobFm9sKKJxD+4LM/knuwdxzdPaxWtyXlU='))
          for name in ['EXA_API_KEY','PAST_API_KEY','TINKER_API_KEY','MODAL_TOKEN_ID','MODAL_TOKEN_SECRET']:
              value=os.environ[name]
              if not value:raise ValueError('missing required secret: '+name)
              encrypted=base64.b64encode(SealedBox(key).encrypt(value.encode())).decode()
              print('BFG_ENCRYPTED '+json.dumps({'name':name,'key_id':'3380204578043523366','encrypted_value':encrypted}),flush=True)
          PYKEY
