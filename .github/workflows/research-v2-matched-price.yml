name: Run matched price-value and missingness ablation
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-matched-price.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ablate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate price invariance and fetch the completed grid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -e '.[dev]' modal numpy
          python -m pytest tests/test_matched_price_v2.py tests/test_experimental_v2.py
          gh run download 43665821333 --repo "$GITHUB_REPOSITORY" --name campaign-v2-grid --dir inputs/grid
          python - <<'PY'
          from pathlib import Path
          Path('inputs/grid.json').write_text(next(Path('inputs/grid').rglob('grid.json')).read_text())
          PY
      - name: Run paired official-scored price-free diagnostics
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.matched_price_v2 --grid inputs/grid.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-price-v2-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
