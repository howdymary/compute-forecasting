name: Audit market-state data v19
on:
  push:
    branches: [compute-observatory]
    paths: ['.github/workflows/audit-market-v19.yml','configs/market-state-v19-readiness.json','src/compute_forecast/market_profile_v19.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Audit actual pack schema and current-only source metadata
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.market_profile_v19
      - name: Publish only metadata and audit receipts
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/market-state-v19-profile
          V18_PUBLIC_KIND: audits
        run: python scripts/publish_market_v19.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-state-v19-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/market-state-v19-profile
          retention-days: 30
