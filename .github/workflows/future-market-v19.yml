name: Issue registered market-state forecasts v19
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/future-market-v19.yml]
  schedule:
    - cron: '5 0 * * 1'
  workflow_run:
    workflows: [Publish matched market-state study v19]
    types: [completed]
    branches: [compute-observatory]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: market-state-v19-future
  cancel-in-progress: false
jobs:
  issue:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch registered current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/compute-observatory" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
          echo "PUBLICATION_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' modal
      - run: python -m pytest tests/test_market_future_v19.py tests/test_market_state_v19.py -q
      - name: Issue only eligible frozen forecasts and keep future truth gated
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.market_future_remote_v19
      - name: Bind permitted publication files to a manifest
        run: python scripts/attest_market_v19.py build artifacts/market-state-v19-future
      - name: Attest publication timing without relying on temporary downloads
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: artifacts/market-state-v19-future/commitment-manifest.json
      - name: Retain and verify the signed publication bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" artifacts/market-state-v19-future/attestation.bundle.json
          python scripts/attest_market_v19.py verify artifacts/market-state-v19-future
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: market-state-v19-future-${{ github.run_id }}
          path: artifacts/market-state-v19-future
          retention-days: 180
      - name: Retain GitHub server publication receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifacts/market-state-v19-future/github-publication-receipt.json
      - name: Publish commitments and pending state
        env:
          GH_TOKEN: ${{ github.token }}
          V18_PUBLIC_ROOT: artifacts/market-state-v19-future
          V18_PUBLIC_KIND: future
        run: python scripts/publish_market_v19.py
