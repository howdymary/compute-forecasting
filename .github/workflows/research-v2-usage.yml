name: Inspect attributed campaign usage and live results
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/research-v2-usage.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read receipts without changing accounts
        env:
          GH_TOKEN: ${{ github.token }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python -m pip install -e . modal numpy tinker
          python -m compileall -q src
          gh run download 43665112830 --repo "$GITHUB_REPOSITORY" --name campaign-v2-evidence-bd267f17fa31106a05a22e3b6b4739f7bd6c0327-43665112830 --dir inputs/evidence
          modal run -m compute_forecast.usage_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v2-usage-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
