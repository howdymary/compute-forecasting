name: Train matched price and BLS forecasting models v14
on:
  push:
    branches: [compute-observatory]
    paths: [.github/workflows/train-evidence-v14.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: evidence-v14-matched-campaign
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch registered source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve unchanged historical examples and exact native references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43952200479 --repo "$GITHUB_REPOSITORY" --name direct-v12-inputs-43952200479 --dir inputs/original
          gh run download 43959603240 --repo "$GITHUB_REPOSITORY" --name direct-v12-reference-43959603240 --dir inputs/reference
          python scripts/resolve_evidence_sources_v14.py
      - name: Install locked client versions
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r inputs/original/requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Verify temporal and matched-input contracts
        run: |
          python -m compileall -q src scripts
          python -m pytest --junitxml=artifacts/evidence-v14-tests.xml
          PYTHONPATH=src BLS_SOURCE_FILE=inputs/source/bls-vintages.json python scripts/prepare_evidence_v14.py
      - name: Verify sample diversity and storage headroom
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: PYTHONPATH=src python scripts/preflight_evidence_sampling_v14.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-v14-inputs-${{ github.run_id }}
          path: inputs/evidence-v14
          retention-days: 30
  train:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [17, 29, 43]
        arm: [price_only, price_evidence]
    steps:
      - name: Fetch identical registered implementation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: evidence-v14-inputs-${{ github.run_id }}
          path: inputs/evidence-v14
      - run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r inputs/evidence-v14/requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Train realized GPU-price returns with matched budgets
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -m compute_forecast.train_evidence_v14 --inputs inputs/evidence-v14 --output artifacts/evidence-v14/${{ matrix.arm }}/seed-${{ matrix.seed }} --seed ${{ matrix.seed }} --arm ${{ matrix.arm }} --storage-mode state_only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-v14-${{ matrix.arm }}-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/evidence-v14/${{ matrix.arm }}/seed-${{ matrix.seed }}
          retention-days: 30
