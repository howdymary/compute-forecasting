name: Record requested Tinker training progression
on:
  workflow_dispatch:
  push:
    branches: [compute-observatory]
    paths: [configs/training-progress-video.json]
permissions:
  contents: write
concurrency:
  group: requested-training-progress-video
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact recording source remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and encoding tools on hosted runner
        run: |
          python -m pip install -e . playwright pillow modal==1.6.4
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m compileall -q src/compute_forecast/record_training_progress.py
      - name: Verify retained predictions and record actual checkpoint progression
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: python -m modal run -m compute_forecast.record_training_progress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-progress-video-${{ github.run_id }}
          path: artifacts/training-progress-video/
          retention-days: 90
