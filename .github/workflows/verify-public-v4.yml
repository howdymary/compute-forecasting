name: Verify public v4 arithmetic without credentials
on:
  push:
    branches: [compute-observatory]
    paths:
      - results/review-v4/**
      - src/compute_forecast/reproduce_operations_v4.py
      - .github/workflows/verify-public-v4.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact public artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/${{ github.sha }}" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m compute_forecast.reproduce_operations_v4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-reproduction-v4-${{ github.run_id }}
          path: artifacts/public-reproduction-v4/
          retention-days: 90
