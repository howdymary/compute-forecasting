name: Evaluate frozen policy and export submission

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-final-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/compute-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Fetch frozen source on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require a committed freeze and validate all boundaries
        run: |
          test -f configs/release-freeze.json
          python -m pip install -e '.[dev]' modal numpy
          python -m compileall -q src
          python -m pytest --junitxml=artifacts/final-boundary-tests.xml
          python - <<'PY'
          import json
          from pathlib import Path
          from compute_forecast.freeze_contract import validate_freeze
          validate_freeze(json.loads(Path('configs/release-freeze.json').read_text()))
          PY
      - name: Install CPU-only model clients on hosted runner
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tinker tinker-cookbook
      - name: Evaluate frozen weights; no training or current-news credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -m compute_forecast.final_evaluation
      - name: Preserve actual final client versions
        if: always()
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/final-client-environment.txt
      - name: Retain every final result and genuine trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-evaluation-${{ github.sha }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: artifacts/
          retention-days: 30
  export:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch the identical frozen source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . modal
      - name: Export November 6 forecasts without retrieving November 7–13 truth
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m compute_forecast.export_submission
      - name: Preserve validated forecasts and separate long-term outlook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-${{ github.sha }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: artifacts/
          retention-days: 30
