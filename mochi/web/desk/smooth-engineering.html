<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOCHI: physical route validation</title><link rel="stylesheet" href="richdesk.css"><link rel="stylesheet" href="balanced.css"><style>main{max-width:1300px;margin:auto;padding:24px}.robot-stage{height:650px}input{width:65%}.toolbar{display:flex;gap:18px;align-items:center;margin:16px 0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head>
<body><main><h1>Physical route validation</h1><p>Recorded controller engineering. Zero new Tinker updates. This view does not establish a training gain.</p><p id="status">Loading recorded evidence.</p><div id="robot" class="robot-stage"></div><div class="toolbar"><button id="play">Play</button><button id="whole">Whole desk</button><button id="feet">Feet</button><input id="time" type="range" min="0" step=".02" value="0"><span id="clock"></span></div></main>
<script type="module">
import {createCurriculumStage} from './curriculum-stage.js';
const q=new URLSearchParams(location.search),name=q.get('recording')||'continuous-route-7',r=await fetch('smooth-v16-engineering/'+name+'.json.gz'),data=await r.arrayBuffer(),row=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).json(),episode=row.episode;
const stage=createCurriculumStage(document.querySelector('#robot'),{scene:episode.scene,fullBody:true});await stage.ready;stage.setEpisode(episode);
const slider=document.querySelector('#time');slider.min=episode.trajectory.frames[0].t;slider.max=episode.duration;slider.value=q.get('t')||slider.min;
let time=+slider.value,playing=false,last=performance.now();
document.querySelector('#status').textContent=(row.complete_sequence_success?'All four tasks completed.':row.failure||'Engineering attempt')+' Source and task outcomes remain in the evidence file.';
document.querySelector('#play').onclick=()=>{playing=!playing};slider.oninput=()=>{time=+slider.value;playing=false};document.querySelector('#whole').onclick=()=>stage.view(true);document.querySelector('#feet').onclick=()=>stage.inspect('feet');
function tick(now){if(playing)time=Math.min(episode.duration,time+Math.max(0,Math.min(.07,(now-last)/1000)));last=now;stage.frame(time);slider.value=time;document.querySelector('#clock').textContent=time.toFixed(1)+' s';requestAnimationFrame(tick)}requestAnimationFrame(tick);window.mochiEngineeringReady=true;
</script></body></html>
