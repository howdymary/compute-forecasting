name: CodeGarden core-quota search with complete star-conflict capture
on:
  push:
    branches: [codegarden-corequota-004]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-free-corequota-004
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  CODEGARDEN_BATCH: corequota_002
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1; then break; fi
            sleep 2
          done
          test -f codegarden/phase3/corequota2.cpp
      - name: Compile and independently exhaust small cases
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/corequota2.cpp -o codegarden/.build/corequota2
          python -B -u codegarden/phase3/test_corequota2.py
          python -B -u codegarden/phase3/test_corequota2_hubs.py
          python -B -u codegarden/phase3/corequota2_prerequisites.py
          python -B -u codegarden/phase3/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: codegarden-bundle-preflight
          path: codegarden/artifacts/phase3/corequota_002/
  probes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        case: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1; then break; fi
            sleep 2
          done
          test -f codegarden/phase3/corequota2.cpp
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-bundle-preflight
          path: codegarden/artifacts/phase3/corequota_002/
      - name: Compile and run bounded component
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/corequota2.cpp -o codegarden/.build/corequota2
          g++ -O3 -std=c++17 codegarden/phase3/bundle_guard.cpp -o codegarden/.build/bundle
          python -B -u codegarden/phase3/corequota2_probe.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: codegarden-bundle-${{ matrix.case }}
          path: codegarden/artifacts/phase3/corequota_002/
  collect:
    needs: [preflight, probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1; then break; fi
            sleep 2
          done
          test -f codegarden/phase3/corequota2.cpp
      - uses: actions/download-artifact@v4
        with:
          pattern: codegarden-bundle-*
          merge-multiple: true
          path: codegarden/artifacts/phase3/corequota_002/
      - name: Publish leased results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -u codegarden/phase3/publish_corequota2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: codegarden-bundle-collected
          path: codegarden/artifacts/phase3/corequota_002/
