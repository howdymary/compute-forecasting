name: CodeGarden matching-bound same-input regression
on:
  push:
    branches: [codegarden-union-bound-audit-003]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-free-union-bound-audit-003
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  TMPDIR: ${{ github.workspace }}/codegarden/.tmp
  PIP_CACHE_DIR: ${{ github.workspace }}/codegarden/.cache/pip
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/codegarden/.cache/playwright
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
          mkdir -p codegarden/.tmp codegarden/.cache/pip codegarden/.cache/playwright
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build old and bounded kernels under the same compiler
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/union_external2.cpp -o codegarden/.build/union_external2
          g++ -O3 -std=c++17 codegarden/phase3/union_external3.cpp -o codegarden/.build/union_external3
          python -B -u codegarden/phase3/bench_union_bound.py
      - name: Publish immutable-source acceptance evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B codegarden/phase3/publish_union_bound_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-union-bound-audit
          retention-days: 1
          path: codegarden/artifacts/phase3/union_bound_benchmark_001/
