name: CodeGarden bounded exchanges from28verified portfolio-novel225orbits
on:
  push:
    branches: [codegarden-fresh225-polish-001]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-free-fresh225-polish-001
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  TMPDIR: ${{ github.workspace }}/codegarden/.tmp
  CODEGARDEN_BATCH: fresh225_polish_001
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1; then break; fi
            sleep 2
          done
          test -f codegarden/phase3/bundle_novel.cpp
          mkdir -p codegarden/.tmp
      - name: Compile and independently exhaust small cases
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/bundle_novel.cpp -o codegarden/.build/bundle_novel
          g++ -O3 -std=c++17 codegarden/phase3/test_bundle_novel.cpp -o codegarden/.build/test_bundle_novel
          codegarden/.build/bundle_novel --synthetic-tests
          codegarden/.build/test_bundle_novel
          mkdir -p codegarden/artifacts/phase3/fresh225_polish_001
          cp codegarden/phase3/fresh225_plan.json codegarden/artifacts/phase3/fresh225_polish_001/plan.json
          python -B -u codegarden/phase3/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: codegarden-fresh225-preflight
          path: codegarden/artifacts/phase3/fresh225_polish_001/
  probes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1; then break; fi
            sleep 2
          done
          test -f codegarden/phase3/bundle_novel.cpp
          mkdir -p codegarden/.tmp
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-fresh225-preflight
          path: codegarden/artifacts/phase3/fresh225_polish_001/
      - name: Compile and run bounded component
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/bundle_novel.cpp -o codegarden/.build/bundle_novel
          python -B -u codegarden/phase3/fresh225_polish.py ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: codegarden-fresh225-${{ matrix.case }}
          path: codegarden/artifacts/phase3/fresh225_polish_001/
  collect:
    needs: [preflight, probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1; then break; fi
            sleep 2
          done
          test -f codegarden/phase3/bundle_novel.cpp
          mkdir -p codegarden/.tmp
      - uses: actions/download-artifact@v4
        with:
          pattern: codegarden-fresh225-*
          merge-multiple: true
          path: codegarden/artifacts/phase3/fresh225_polish_001/
      - name: Publish leased results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -u codegarden/phase3/publish_fresh225_polish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: codegarden-fresh225-collected
          path: codegarden/artifacts/phase3/fresh225_polish_001/
