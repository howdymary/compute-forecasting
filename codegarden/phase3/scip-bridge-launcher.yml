name: CodeGarden SCIP feasibility and backbone escape
on:
  push:
    branches: [codegarden-scip-bridge-003]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-free-scip-bridge-003
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  CODEGARDEN_BATCH: scip_bridge_001
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - name: Verify current official baseline
        run: python -B -u codegarden/phase3/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: codegarden-bundle-preflight
          path: codegarden/artifacts/phase3/scip_bridge_001/
  probes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [0, 1, 2, 3]
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-bundle-preflight
          path: codegarden/artifacts/phase3/scip_bridge_001/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pinned solver
        run: |
          python -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install ortools==9.14.6206
      - name: Solve feasibility with separate MILP backend
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/bundle_connected_v2.cpp -o codegarden/.build/bundle
          codegarden/.venv/bin/python -B -u codegarden/phase3/scip_bridge.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-bundle-${{ matrix.case }}
          path: codegarden/artifacts/phase3/scip_bridge_001/
  collect:
    needs: [preflight, probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          pattern: codegarden-bundle-*
          merge-multiple: true
          path: codegarden/artifacts/phase3/scip_bridge_001/
      - name: Publish leased results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -u codegarden/phase3/publish_scip_bridge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-bundle-collected
          path: codegarden/artifacts/phase3/scip_bridge_001/
