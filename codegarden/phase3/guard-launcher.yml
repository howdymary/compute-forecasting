name: CodeGarden allocation-free blocker guard
on:
  push:
    branches: [codegarden-guard-003]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-free-guard-003
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}
  CODEGARDEN_BATCH: guard_001
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - name: Compile and independently exhaust small cases
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/bundle_guard.cpp -o codegarden/.build/bundle
          codegarden/.build/bundle --synthetic-tests > codegarden/.build/synthetic.json
          python -B -u codegarden/phase3/test_connected2.py
          python -B -u codegarden/phase3/test_dominance_local.py
          mkdir -p codegarden/artifacts/phase3/guard_001
          mv codegarden/.build/synthetic.json codegarden/artifacts/phase3/guard_001/test_synthetic.json
          python -B -u codegarden/phase3/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: codegarden-bundle-preflight
          path: codegarden/artifacts/phase3/guard_001/
  probes:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [benchmark8, strict9, strict10]
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-bundle-preflight
          path: codegarden/artifacts/phase3/guard_001/
      - name: Compile and run bounded component
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase3/bundle_guard.cpp -o codegarden/.build/bundle
          g++ -O3 -std=c++17 codegarden/phase3/bundle_sharded.cpp -o codegarden/.build/guard_old
          python -B -u codegarden/phase3/guard_probe.py --mode ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-bundle-${{ matrix.mode }}
          path: codegarden/artifacts/phase3/guard_001/
  collect:
    needs: [preflight, probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/download-artifact@v4
        with:
          pattern: codegarden-bundle-*
          merge-multiple: true
          path: codegarden/artifacts/phase3/guard_001/
      - name: Publish leased results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -u codegarden/phase3/publish_guard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-bundle-collected
          path: codegarden/artifacts/phase3/guard_001/
