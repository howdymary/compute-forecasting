name: CodeGarden isolated research
on:
  push:
    branches: [codegarden]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-only
  cancel-in-progress: false
jobs:
  verify-and-search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify protected boundary and existing tests
        run: |
          python -B -m unittest discover -s codegarden/tests -v
          python -B codegarden/supervisor.py codegarden/artifacts/best_code.txt
      - name: Compile and check exact exchanges against brute force
        run: |
          mkdir -p codegarden/.build
          g++ -O3 -std=c++17 codegarden/phase2/kernel_v2.cpp -o codegarden/.build/kernel_v2
          python -B codegarden/phase2/test_exchange.py
          python -B codegarden/phase2/sweep.py
      - name: Publish only CodeGarden receipts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python -B codegarden/ci/publish_results.py
