name: CodeGarden exact Hadamard neighborhood scan
on:
  push:
    branches: [codegarden-hadamard-scan-001]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-hadamard-scan-001
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch isolated sources and frozen verifiers
        run: |
          python3 -B - <<'PY'
          import pathlib,urllib.request,os
          paths=["codegarden/hadamard/"+n for n in ["scan.py","official.py","independent.py","manifest.json"]]+["codegarden/side_services/cycle.py","codegarden/supervisor.py","codegarden/protected/manifest.json","codegarden/protected/verify_descendants.py","codegarden/protected/verify_lcs.py"]
          for name in paths:
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/howdymary/compute-forecasting/"+os.environ["SOURCE_SHA"]+"/"+name,timeout=45).read())
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated dependencies
        run: |
          python3 -m venv codegarden/.venv-hadamard
          codegarden/.venv-hadamard/bin/python -m pip install --disable-pip-version-check numpy==2.4.6 sympy==1.14.0
      - name: Lemma fixtures and bounded exact-gated scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: codegarden/.venv-hadamard/bin/python -B -u codegarden/hadamard/scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-hadamard-scan
          retention-days: 30
          path: codegarden/artifacts/hadamard/scan_001/
