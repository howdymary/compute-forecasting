name: CodeGarden global elastic barrier search
on:
  push:
    branches: [codegarden-side-elastic-001]
    paths: [.github/workflows/codegarden.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codegarden-side-elastic-001
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HOME: ${{ github.workspace }}/codegarden/.cache/huggingface
  XDG_CACHE_HOME: ${{ github.workspace }}/codegarden/.cache
  TMPDIR: ${{ github.workspace }}/codegarden/.tmp
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      has_candidate: ${{ steps.cycle.outputs.has_candidate }}
    steps:
      - name: Fetch minimal isolated source
        run: |
          python3 -B - <<'PY'
          import os,pathlib,urllib.request
          pathlib.Path("codegarden/.tmp").mkdir(parents=True,exist_ok=True)
          for name in ["codegarden/side_elastic/model.py","codegarden/side_elastic/experiment.py","codegarden/side_elastic/requirements.txt","codegarden/side_services/cycle.py","codegarden/supervisor.py","codegarden/protected/manifest.json","codegarden/protected/verify_descendants.py","codegarden/protected/verify_lcs.py","codegarden/artifacts/best_code.txt","codegarden/artifacts/phase3/soft_global_001/report.json"]:
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/howdymary/compute-forecasting/"+os.environ["SOURCE_SHA"]+"/"+name,timeout=45).read())
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated pinned clients and solver
        run: |
          python3 -m venv codegarden/.venv
          codegarden/.venv/bin/python -m pip install --disable-pip-version-check -r codegarden/side_elastic/requirements.txt
      - name: Independent small-instance incidence and solver checks
        run: |
          mkdir -p codegarden/artifacts/side_research/elastic_001
          codegarden/.venv/bin/python -B -u codegarden/side_elastic/model.py > codegarden/artifacts/side_research/elastic_001/smoke.json
      - name: Run bounded full-universe hard and elastic searches
        id: cycle
        env:
          GH_TOKEN: ${{ github.token }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: codegarden/.venv/bin/python -B -u codegarden/side_elastic/experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-elastic-research
          retention-days: 30
          path: codegarden/artifacts/side_research/elastic_001/
      - uses: actions/upload-artifact@v4
        if: steps.cycle.outputs.has_candidate == 'true'
        with:
          name: codegarden-elastic-227-candidate
          retention-days: 30
          path: codegarden/artifacts/side_research/elastic_001/candidate.txt
  accept:
    needs: research
    if: needs.research.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch frozen independent checker sources
        run: |
          python3 -B - <<'PY'
          import pathlib,urllib.request
          for name in ["supervisor.py","protected/manifest.json","protected/verify_descendants.py","protected/verify_lcs.py"]:
              p=pathlib.Path("codegarden")/name;p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/howdymary/compute-forecasting/ce5eab1859c271686876ee5c2d21c0e0a5316d67/codegarden/"+name,timeout=30).read())
          PY
      - uses: actions/download-artifact@v4
        with:
          name: codegarden-elastic-227-candidate
          path: codegarden/.verify-input/
      - name: Accept candidate without proposer or service credentials
        run: |
          python3 -B - <<'PY'
          import pathlib,json,sys
          sys.path.insert(0,"codegarden")
          from supervisor import verify
          result=verify(pathlib.Path("codegarden/.verify-input/candidate.txt"))
          assert result["cardinality"]>=227
          pathlib.Path("codegarden/isolated_acceptance.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegarden-elastic-isolated-acceptance
          retention-days: 30
          path: codegarden/isolated_acceptance.json
